<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Thanh điều hướng</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/labelx/tokens.css">
<link rel="stylesheet" href="ds/labelx/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="lx" style="position: relative; z-index: 20">
<header class="lx-topnav">
<a class="lx-logo" href="Main.dc.html">Label<b>X</b></a>
<nav class="lx-nav" aria-label="Quality Control">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="7">
<div class="lx-nav__group">
<sc-if value="{{t.isDirect}}" hint-placeholder-val="{{false}}"><a class="{{t.cls}}" href="{{t.href}}">{{t.label}}</a></sc-if>
<sc-if value="{{t.isMenu}}" hint-placeholder-val="{{true}}"><button class="{{t.cls}}" aria-haspopup="menu" aria-expanded="{{t.expanded}}" onClick="{{t.toggle}}">{{t.label}}<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5"></path></svg></button></sc-if>
<sc-if value="{{t.isOpen}}" hint-placeholder-val="{{false}}">
<div class="lx-menu" role="menu">
<div class="lx-menu__head">{{t.label}}</div>
<sc-for list="{{t.items}}" as="it" hint-placeholder-count="3">
<a class="{{it.cls}}" role="menuitem" href="{{it.href}}"><span class="lx-menu__t">{{it.title}}</span>
<sc-if value="{{it.active}}" hint-placeholder-val="{{false}}"><svg class="lx-menu__check" viewBox="0 0 16 16" role="img" aria-label="Đang xem"><path d="M3 8.5 6.5 12 13 4.5"></path></svg></sc-if>
<svg class="lx-menu__ico" viewBox="0 0 16 16" aria-hidden="true"><path d="{{it.icon}}"></path></svg><span class="lx-menu__d">{{it.desc}}</span></a>
</sc-for>
</div>
</sc-if>
</div>
</sc-for>
</nav>
<div class="lx-userwrap">
<button class="lx-user lx-user--btn" aria-haspopup="menu" aria-expanded="{{userOpen}}" onClick="{{toggleUser}}">
<span class="lx-user__meta"><span class="lx-user__name">Mocking User</span><span class="lx-user__role">Super Admin</span></span>
<span class="lx-avatar" role="img" aria-label="Mocking User">MU</span>
<svg class="lx-user__chev" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5"></path></svg>
</button>
<sc-if value="{{userOpen}}" hint-placeholder-val="{{false}}">
<div class="lx-menu lx-menu--user" role="menu">
<sc-for list="{{userItems}}" as="u" hint-placeholder-count="3">
<a class="lx-menu__item" role="menuitem" href="#"><svg class="lx-menu__ico lx-menu__ico--l" viewBox="0 0 16 16" aria-hidden="true"><path d="{{u.icon}}"></path></svg><span class="lx-menu__t">{{u.label}}</span></a>
</sc-for>
</div>
</sc-if>
</div>
</header>

<sc-if value="{{anyOpen}}" hint-placeholder-val="{{false}}">
<div class="lx-backdrop" onClick="{{closeAll}}"></div>
</sc-if>

<div class="lx-ctxbar">
<div class="lx-ctx">
<button class="lx-chip" aria-haspopup="menu" aria-expanded="{{dsOpen}}" onClick="{{toggleDs}}"><span class="lx-chip__k">Dataset</span><span class="lx-chip__v">{{datasetName}}</span>
<sc-if value="{{readonly}}" hint-placeholder-val="{{false}}"><span class="lx-tag lx-tag--ro">read-only</span></sc-if>
<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5"></path></svg></button>
<sc-if value="{{dsOpen}}" hint-placeholder-val="{{false}}"><div class="lx-menu" role="menu"><div class="lx-menu__head">Dataset và Version</div>
<sc-for list="{{dsItems}}" as="o" hint-placeholder-count="2"><button type="button" class="{{o.cls}}" role="menuitem" onClick="{{o.pick}}"><span class="lx-menu__t">{{o.label}}</span><sc-if value="{{o.on}}" hint-placeholder-val="{{false}}"><svg class="lx-menu__check" viewBox="0 0 16 16" role="img" aria-label="Đang chọn"><path d="M3 8.5 6.5 12 13 4.5"></path></svg></sc-if></button></sc-for>
</div></sc-if>
</div>
<div class="lx-ctx">
<button class="lx-chip" aria-haspopup="menu" aria-expanded="{{runOpen}}" onClick="{{toggleRun}}"><span class="lx-chip__k">Quality Control Run</span><span class="lx-chip__v lx-mono">{{runId}}</span><span class="lx-dot" style="background: {{runColor}}" title="{{runTitle}}" aria-label="{{runTitle}}"></span>
<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5"></path></svg></button>
<sc-if value="{{runOpen}}" hint-placeholder-val="{{false}}"><div class="lx-menu" role="menu"><div class="lx-menu__head">Quality Control Run</div>
<sc-for list="{{runItems}}" as="o" hint-placeholder-count="2"><button type="button" class="{{o.cls}}" role="menuitem" onClick="{{o.pick}}"><span class="lx-menu__t lx-mono">{{o.label}}</span><span class="lx-menu__meta">{{o.state}}</span></button></sc-for>
</div></sc-if>
</div>
<span class="lx-chip lx-chip--static" title="Snapshot bất biến"><span class="lx-chip__k">Snapshot</span><span class="lx-chip__v lx-mono">{{snapshotId}}</span><span class="lx-mono" style="color: var(--ink-muted)">{{revision}}</span>
<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" role="img" aria-label="Đã khoá"><rect x="3.5" y="7" width="9" height="6.5" rx="1.5"></rect><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"></path></svg></span>
<div class="lx-ctx">
<button class="lx-chip" aria-haspopup="menu" aria-expanded="{{scopeOpen}}" onClick="{{toggleScope}}"><span class="lx-chip__k">Phạm vi</span><span class="lx-chip__v">{{scopeName}}</span>
<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5"></path></svg></button>
<sc-if value="{{scopeOpen}}" hint-placeholder-val="{{false}}"><div class="lx-menu" role="menu"><div class="lx-menu__head">Phạm vi</div>
<sc-for list="{{scopeItems}}" as="o" hint-placeholder-count="3"><button type="button" class="{{o.cls}}" role="menuitem" onClick="{{o.pick}}"><span class="lx-menu__t">{{o.label}}</span><sc-if value="{{o.on}}" hint-placeholder-val="{{false}}"><svg class="lx-menu__check" viewBox="0 0 16 16" role="img" aria-label="Đang chọn"><path d="M3 8.5 6.5 12 13 4.5"></path></svg></sc-if></button></sc-for>
</div></sc-if>
</div>
<span class="lx-chip lx-chip--static"><span class="lx-chip__k">Guideline</span><span class="lx-chip__v">{{guidelineName}}</span></span>
<span class="lx-chip lx-chip--static"><span class="lx-chip__k">Taxonomy</span><span class="lx-chip__v">{{taxonomyName}}</span></span>
</div>
</div></x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"text","default":"overview"},"activeItem":{"editor":"text","default":""},"menuOpen":{"editor":"text","default":""},"readonly":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":100}}'>
class Component extends DCLogic {
  renderVals() {
    const MENU = [
      { key: 'overview', label: 'Overview', items: [
        { key: 'home', icon: 'M2.5 7.5 8 3l5.5 4.5V13a.5.5 0 0 1-.5.5H3a.5.5 0 0 1-.5-.5zM6.5 13.5v-4h3v4', href: 'Main.dc.html', title: 'Quality Control Home', desc: 'Chọn Dataset và Version để làm việc' },
        { key: 'summary', icon: 'M3 13V8M8 13V3M13 13V6', href: 'Dashboard.dc.html', title: 'Quality Summary', desc: 'Tình trạng chất lượng, coverage, khối lượng review' } ] },
      { key: 'analysis', label: 'Quality Analysis', direct: 'Snapshot.dc.html' },
      { key: 'review', label: 'Review Center', direct: 'ReviewQueues.dc.html' },
      { key: 'escalations', label: 'Escalations', direct: 'Escalations.dc.html' },
      { key: 'calibration', label: 'Calibration & Audit', items: [
        { key: 'performance', icon: 'M2 12l4-4 3 3 5-6', href: 'PerformanceEvaluation.dc.html', title: 'Performance Evaluation', desc: 'Đánh giá chất lượng của chính quy trình kiểm tra' },
        { key: 'benchmark', icon: 'M4 14V2.5M4 3h8l-1.5 3L12 9H4', href: 'Benchmark.dc.html', title: 'Ground Truth Benchmark', desc: 'Tập chuẩn đã được chuyên gia khoá' },
        { key: 'audit', icon: 'M5.5 2.5h5v2h-5zM4 4H3.5v9.5h9V4H12M6 9l1.5 1.5L10.5 7.5', href: 'AuditSampling.dc.html', title: 'Audit Sampling', desc: 'Lấy mẫu ngẫu nhiên và lấy mẫu theo rủi ro' },
        { key: 'calibrate', icon: 'M3 5h6M11 5h2M3 11h2M7 11h6M9 3.5v3M5 9.5v3', href: 'Calibration.dc.html', title: 'Calibration', desc: 'Hiệu chỉnh reviewer và mô hình' } ] },
      { key: 'reports', label: 'Reports & Releases', direct: 'QualityReport.dc.html' },
      { key: 'configuration', label: 'Configuration', items: [
        { key: 'rules', icon: 'M3 4h10M3 8h10M3 12h6', href: 'RulesThresholds.dc.html', title: 'Rules & Thresholds', desc: 'Quy tắc kiểm tra và chính sách lấy mẫu' },
        { key: 'models', icon: 'M8 2l5 2.5v5L8 12 3 9.5v-5zM3 4.5 8 7l5-2.5M8 7v5', href: 'ModelsGuidelines.dc.html', title: 'Models & Guidelines', desc: 'Cấu hình mô hình và ánh xạ phiên bản guideline' },
        { key: 'permissions', icon: 'M8 8a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zM3 13.5c.5-2.5 2.5-3.5 5-3.5s4.5 1 5 3.5', href: 'WorkflowPermissions.dc.html', title: 'Workflow & Permissions', desc: 'Quy trình làm việc và phân quyền theo vai trò' } ] }
    ];
    const open = (this.state && this.state.open !== undefined) ? this.state.open : (this.props.menuOpen || null);
    const active = this.props.active || 'overview';
    const activeItem = this.props.activeItem || '';
    const tabs = MENU.map((t) => {
      const isMenu = !t.direct;
      const isOpen = isMenu && open === t.key;
      return {
        label: t.label,
        cls: 'lx-navbtn' + (active === t.key ? ' is-active' : ''),
        isDirect: !isMenu,
        isMenu: isMenu,
        href: t.direct || '#',
        expanded: isOpen,
        isOpen: isOpen,
        toggle: () => this.setState({ cx: null, ux: false, open: isOpen ? null : t.key }),
        items: (t.items || []).map((it) => { const on = active === t.key && activeItem === it.key; return { title: it.title, icon: it.icon, meta: '', desc: it.desc, href: it.href, active: on, cls: 'lx-menu__item' + (on ? ' is-active' : '') }; })
      };
    });
    const ST = this.state || {};
    const DATA = [
      { key: 'v14', name: 'Road Vision Urban · v1.4', ro: false, gl: 'v1.2', tx: 'v3', runs: [
        { id: '#QC-091', st: 'PARTIAL', color: 'var(--warning)', snap: 'SNP-014', rev: 'rev a91f3c' },
        { id: '#QC-088', st: 'FAILED', color: 'var(--danger)', snap: 'SNP-013', rev: 'rev 7c20de' } ] },
      { key: 'v13', name: 'Road Vision Urban · v1.3', ro: true, gl: 'v1.1', tx: 'v3', runs: [
        { id: '#QC-077', st: 'PASSED', color: 'var(--success)', snap: 'SNP-011', rev: 'rev f02a6d' } ] }
    ];
    const SCOPES = ['Toàn dataset', 'Task T-118', 'Task T-119', 'Task T-120'];
    const dsKey = ST.ds || (this.props.readonly ? 'v13' : 'v14');
    const ds = DATA.find((d) => d.key === dsKey) || DATA[0];
    const run = ds.runs.find((r) => r.id === ST.run) || ds.runs[0];
    const scope = ST.scope || SCOPES[0];
    const cx = ST.cx || null;
    return {
      tabs: tabs,
      anyOpen: !!open || !!cx || !!ST.ux,
      userOpen: !!ST.ux,
      toggleUser: () => this.setState({ open: null, cx: null, ux: !ST.ux }),
      userItems: [{ label: 'Hồ sơ', icon: 'M8 8a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zM3 13.5c.5-2.5 2.5-3.5 5-3.5s4.5 1 5 3.5' }, { label: 'Cài đặt', icon: 'M8 10a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM8 2v1.5M8 12.5V14M2 8h1.5M12.5 8H14M3.8 3.8l1 1M11.2 11.2l1 1M12.2 3.8l-1 1M4.8 11.2l-1 1' }, { label: 'Đăng xuất', icon: 'M6 3H3.5v10H6M10 5.5 12.5 8 10 10.5M12.5 8H6.5' }],
      closeAll: () => this.setState({ open: null, ux: false, cx: null }),
      readonly: ds.ro,
      datasetName: ds.name,
      runId: run.id,
      runColor: run.color,
      runTitle: 'Trạng thái: ' + run.st,
      snapshotId: run.snap,
      revision: run.rev,
      scopeName: scope,
      guidelineName: ds.gl,
      taxonomyName: ds.tx,
      dsOpen: cx === 'ds', runOpen: cx === 'run', scopeOpen: cx === 'scope',
      toggleDs: () => this.setState({ open: null, ux: false, cx: cx === 'ds' ? null : 'ds' }),
      toggleRun: () => this.setState({ open: null, ux: false, cx: cx === 'run' ? null : 'run' }),
      toggleScope: () => this.setState({ open: null, ux: false, cx: cx === 'scope' ? null : 'scope' }),
      dsItems: DATA.map((d) => ({ label: d.name + (d.ro ? ' (read-only)' : ''), on: d.key === ds.key, cls: 'lx-menu__item' + (d.key === ds.key ? ' is-active' : ''), pick: () => this.setState({ ds: d.key, run: d.runs[0].id, cx: null }) })),
      runItems: ds.runs.map((r) => ({ label: r.id, state: r.st, cls: 'lx-menu__item' + (r.id === run.id ? ' is-active' : ''), pick: () => this.setState({ run: r.id, cx: null }) })),
      scopeItems: SCOPES.map((n) => ({ label: n, on: n === scope, cls: 'lx-menu__item' + (n === scope ? ' is-active' : ''), pick: () => this.setState({ scope: n, cx: null }) }))
    };
  }
}
</script>
</body>
</html>
