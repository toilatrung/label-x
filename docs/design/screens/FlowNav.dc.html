<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Điều hướng theo quy trình</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/labelx/tokens.css">
<link rel="stylesheet" href="ds/labelx/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="lx">
<nav class="lx-flow" aria-label="{{flowLabel}}">
<span class="lx-flow__k">{{flowLabel}}</span>
<a class="{{prevCls}}" href="{{prevHref}}" data-tip="{{prevTip}}" aria-label="{{prevTip}}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5 5.5 8 10 12.5"></path></svg></a>
<ol class="lx-flow__steps">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
<li class="{{s.cls}}"><a href="{{s.href}}" aria-current="{{s.current}}"><span class="lx-flow__n">{{s.n}}</span>{{s.title}}</a></li>
<sc-if value="{{s.sep}}" hint-placeholder-val="{{true}}"><li aria-hidden="true"><svg class="lx-flow__sep" viewBox="0 0 12 12"><path d="M4.5 3 7.5 6 4.5 9"></path></svg></li></sc-if>
</sc-for>
</ol>
<span class="lx-flow__pos">{{pos}}</span>
<a class="{{nextCls}}" href="{{nextHref}}" data-tip="{{nextTip}}" aria-label="{{nextTip}}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"></path></svg></a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"flow":{"editor":"text","default":"analysis"},"step":{"editor":"text","default":"snapshot"},"$preview":{"width":1392,"height":48}}'>
class Component extends DCLogic {
  renderVals() {
    const FLOWS = {
      analysis: { label: 'Quy trình phân tích', steps: [
        { key: 'snapshot', href: 'Snapshot.dc.html', title: 'Snapshot' },
        { key: 'config', href: 'AnalysisConfig.dc.html', title: 'Analysis Configuration' },
        { key: 'history', href: 'ExecutionHistory.dc.html', title: 'Execution History' } ] },
      review: { label: 'Quy trình review', steps: [
        { key: 'queues', href: 'ReviewQueues.dc.html', title: 'Review Queues' },
        { key: 'workspace', href: 'ReviewWorkspace.dc.html', title: 'Review Workspace' },
        { key: 'rework', href: 'ReworkTracking.dc.html', title: 'Rework Tracking' } ] },
      release: { label: 'Quy trình nghiệm thu', steps: [
        { key: 'report', href: 'QualityReport.dc.html', title: 'Quality Report' },
        { key: 'gate', href: 'QualityGate.dc.html', title: 'Quality Gate' },
        { key: 'release', href: 'ReleaseHistory.dc.html', title: 'Release History' } ] }
    };
    const f = FLOWS[this.props.flow] || FLOWS.analysis;
    const idx = Math.max(0, f.steps.findIndex((s) => s.key === this.props.step));
    const prev = f.steps[idx - 1], next = f.steps[idx + 1];
    return {
      flowLabel: f.label,
      pos: 'Bước ' + (idx + 1) + ' / ' + f.steps.length,
      steps: f.steps.map((s, i) => ({ n: i + 1, title: s.title, href: s.href, cls: 'lx-flow__step' + (i === idx ? ' is-active' : ''), current: i === idx ? 'step' : 'false', sep: i < f.steps.length - 1 })),
      prevHref: prev ? prev.href : '#', prevCls: 'lx-iconbtn lx-flow__arrow' + (prev ? '' : ' is-off'), prevTip: prev ? 'Bước trước: ' + prev.title : 'Đây là bước đầu tiên',
      nextHref: next ? next.href : '#', nextCls: 'lx-iconbtn lx-flow__arrow' + (next ? '' : ' is-off'), nextTip: next ? 'Bước sau: ' + next.title : 'Đây là bước cuối cùng'
    };
  }
}
</script>
</body>
</html>
