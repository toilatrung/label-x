      description: Tìm lại evaluation sau khi tải lại trang (BLOCKER-034 B-4). Cùng vai trò và phạm vi Dataset với POST.
      x-labelx-trace: [FR-ENG-08]
      x-labelx-roles: [reviewer, qa_lead, qc_admin, super_admin]
