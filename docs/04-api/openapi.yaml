          description: Các action reviewer theo FR-REV-08; adjudicate_* ghi đủ ba kết luận FR-ESC-02 và chỉ dành cho QA Lead. Không adjudication nào được tính KPI-2b.
        revision: { type: string, description: Revision hash của snapshot gắn với quyết định (FR-REV-10). }
        reason: { type: string, description: "Lý do đã ghi cùng quyết định và audit event (FR-REV-08, FR-REV-10)." }
        rule_ids:
          type: array
          uniqueItems: true
          items: { type: string }
          description: Rule ID được chọn hoặc áp dụng; rỗng khi quyết định không gắn rule (FR-REV-10).
        reference_version:
          type: string
          nullable: true
          description: Version reference đã khoá dùng để resolve reference_error_ids.
        reference_match_status:
          type: string
          enum: [matched, not_matched, not_evaluated]
          description: matched/not_matched yêu cầu reference_version đã khoá; not_evaluated dùng khi chưa có reference và reference_version là null.
        reference_error_ids:
          type: array
          uniqueItems: true
          items: { type: string }
          description: Danh sách phần tử E khớp chính xác theo reference_version và DEC-006 anchor. Chỉ được có phần tử khi actor_role=reviewer, decision=confirm và reference_match_status=matched; rỗng ở trường hợp khác. KPI-2b đếm distinct ID.
        recorded_at: { type: string, format: date-time }
    FrameIssues:
      type: object
      required: [frame, engines, issues, guideline_version]
      properties:
        frame: { $ref: "#/components/schemas/FrameSummary" }
        guideline_version: { type: string, nullable: true }
        snapshot_revision:
          type: string
          description: Revision snapshot đã khoá của run, do server cấp (không lấy từ client)
        annotations:
          type: array
          description: Mọi annotation của frame trong snapshot, kể cả object không có candidate
          items: { $ref: "#/components/schemas/FrameAnnotation" }
        predictions:
          type: array
          description: Output engine bất biến của run cho frame
          items: { $ref: "#/components/schemas/FramePrediction" }
        engines:
          type: array
          items: { $ref: "#/components/schemas/EngineRunStatus" }
        issues:
          type: array
          items: { $ref: "#/components/schemas/Issue" }
    FrameAnnotation:
      type: object
      required: [id, source, label_id, bbox]
      properties:
        id: { type: string, description: "<source.kind>:<source.id>" }
        source:
          type: object
          required: [kind, id]
          properties:
            kind: { type: string }
            id: { type: integer }
        label_id: { type: integer }
        label: { type: string, nullable: true, description: "CVAT label name captured in the snapshot" }
        color: { type: string, nullable: true, description: "CVAT label color captured in the snapshot" }
        bbox:
          type: object
          nullable: true
          required: [x1, y1, x2, y2]
          properties:
            x1: { type: number }
            y1: { type: number }
            x2: { type: number }
            y2: { type: number }
        rotation: { type: number }
        occluded: { type: boolean }
        outside: { type: boolean }
        z_order: { type: integer }
        attributes: { type: array, items: { type: object, additionalProperties: true } }
    FramePrediction:
      type: object
      required: [candidate_id, engine, engine_version, family, anchor, evidence]
      properties:
        candidate_id: { type: integer }
        engine: { type: string }
        engine_version: { type: string }
        family: { type: string }
        anchor: { type: object, additionalProperties: true }
        evidence: {}
    FrameCompleteRequest:
      type: object
      required: [lease_id]
      properties:
        lease_id: { type: integer }

    # -------------------------------------------- quyết định, phân xử, rework
    ManualIssueCreate:
      type: object
      required: [frame_id, lease_id, family, anchor]
      properties:
        frame_id: { type: integer }
        lease_id: { type: integer }
        family: { $ref: "#/components/schemas/IssueFamily" }
        anchor: { $ref: "#/components/schemas/Anchor" }
        description: { type: string }
      description: anchor.kind chỉ nhận manual_object hoặc manual_region; kiểm lease và self-review.
    IssueDecisionAction:
      type: string
      description: Chỉ các action được nhận tại POST /api/issues/{id}/decisions/.
      enum: [confirm, reject, uncertain, escalate]
    PersistedIssueDecisionAction:
      type: string
      description: Action được lưu/trả về; request_fix do POST /api/rework/ tạo nguyên tử.
      enum: [confirm, reject, uncertain, escalate, request_fix]
    IssueDecisionCreate:
      type: object
      required: [lease_id, action, revision]
      properties:
        lease_id: { type: integer }
        action: { $ref: "#/components/schemas/IssueDecisionAction" }
        revision: { type: string, description: Revision snapshot đang review }
        family: { $ref: "#/components/schemas/IssueFamily" }
        severity: { $ref: "#/components/schemas/Severity" }
        reason: { type: string }
        rule_id: { type: string }
        override_reason: { type: string }
      description: |
        confirm bắt buộc family và severity. reject/uncertain/escalate bắt buộc reason.
        request_fix không được nhận ở endpoint decisions; gửi chi tiết yêu cầu sửa tới /api/rework/.
        override_reason bắt buộc nếu Super Admin dùng quyền ghi đè.
    IssueDecision:
      type: object
      required: [id, issue_id, action, actor_user_id, revision, created_at, family, severity, reason, rule_id]
      properties:
        id: { type: integer }
        issue_id: { type: integer }
        action: { $ref: "#/components/schemas/PersistedIssueDecisionAction" }
        actor_user_id: { type: integer }
        revision: { type: string }
        family: { $ref: "#/components/schemas/IssueFamily" }
        severity:
          allOf: [{ $ref: "#/components/schemas/Severity" }]
          nullable: true
        reason: { type: string, nullable: true }
        rule_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        audit_event_id: { type: integer }
    AdjudicationCreate:
      type: object
      required: [outcome, rule_id, reason]
      properties:
        outcome: { type: string, enum: [confirm, reject, guideline_gap] }
        rule_id: { type: string }
        correct_label: { type: string, nullable: true }
        reason: { type: string, minLength: 1 }
        override_reason: { type: string }
        after_adjudication:
          type: string
          enum: [none, request_rework]
          default: none
          description: request_rework tạo yêu cầu sửa (rework) sau khi phân xử (MBE-02); chỉ hợp lệ với outcome confirm
    Adjudication:
      type: object
      required: [id, issue_id, outcome, actor_user_id, rule_id, reason, case_version, created_at, correct_label]
      properties:
        id: { type: integer }
        issue_id: { type: integer }
        outcome: { type: string, enum: [confirm, reject, guideline_gap] }
        actor_user_id: { type: integer }
        rule_id: { type: string }
        correct_label: { type: string, nullable: true }
        reason: { type: string }
        case_version: { type: string }
        created_at: { type: string, format: date-time }
        rework_id: { type: integer, nullable: true, description: Có khi after_adjudication=request_rework (MBE-02) }
    ReworkCreate:
      type: object
      required: [issue_id, instruction, annotator_user_id, due_at, severity, cvat_deep_link]
      properties:
        issue_id: { type: integer }
        instruction: { type: string, minLength: 1 }
        annotator_user_id: { type: integer }
        due_at: { type: string, format: date-time }
        severity: { $ref: "#/components/schemas/Severity" }
        cvat_deep_link: { type: string, format: uri }
    ReworkSubmission:
      type: object
      required: [cvat_revision]
      properties:
        cvat_revision: { type: string, minLength: 1 }
    ReworkVerification:
      type: object
      required: [passed, revision]
      properties:
        passed: { type: boolean }
        revision: { type: string }
        reason: { type: string, description: Bắt buộc khi passed=false }
        override_reason: { type: string }
    ReworkRequest:
      type: object
      required: [id, issue_id, annotator_user_id, status, original_revision, due_at, submitted_revision, recheck_run_id, cvat_deep_link]
      properties:
        id: { type: integer }
        issue_id: { type: integer }
        annotator_user_id: { type: integer }
        status: { type: string, enum: [fix_pending, recheck_pending, resolved, reopened] }
        original_revision: { type: string }
        submitted_revision: { type: string, nullable: true }
        recheck_run_id: { type: integer, nullable: true }
        due_at: { type: string, format: date-time }
        cvat_deep_link: { type: string, format: uri }

    # ----------------------------------------------- reference và evaluation
    ReferenceCreate:
      type: object
      required: [snapshot_id, gt_source, gt_checksum, mapping_version]
      properties:
        snapshot_id: { type: integer }
        gt_source: { type: string, description: Pilot dùng tệp nhãn gốc BDD100K }
        gt_checksum: { type: string, description: SHA-256 của GT đầu vào }
        mapping_version: { type: string }
        matching_threshold: { type: number, minimum: 0, maximum: 1 }
        minimum_area: { type: number, minimum: 0 }
        algorithm_version: { type: string }
    GroundTruthUpload:
      type: object
      nullable: true
      required: [reference, dataset_id, filename, frame_count, box_count, deleted_at, is_current]
      properties:
        reference: { $ref: "#/components/schemas/Reference" }
        dataset_id: { type: integer }
        filename: { type: string }
        frame_count: { type: integer }
        box_count: { type: integer }
        deleted_at: { type: string, format: date-time, nullable: true }
        is_current: { type: boolean }
    Reference:
      type: object
      required: [id, snapshot_id, gt_checksum, mapping_version, status, created_by]
      properties:
        id: { type: integer }
        snapshot_id: { type: integer }
        gt_checksum: { type: string }
        mapping_version: { type: string }
        matching_threshold: { type: number }
        minimum_area: { type: number }
        algorithm_version: { type: string }
        status: { type: string, enum: [draft, locked] }
        created_by: { type: integer }
        locked_by: { type: integer, nullable: true }
        locked_at: { type: string, format: date-time, nullable: true }
    EffortEventBatch:
      type: object
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/EffortEvent" }
    EffortEvent:
      type: object
      required: [client_event_id, frame_id, activity, started_at, ended_at]
      properties:
        client_event_id: { type: string, format: uuid }
        frame_id: { type: integer }
        activity: { type: string, enum: [view_frame, review_issue, adjudicate, recheck_verify] }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        gaps:
          type: array
          items: { $ref: "#/components/schemas/EffortGap" }
        policy_version: { type: string, maxLength: 64 }
    EffortGap:
      type: object
      description: Khoảng trong event mà người dùng không làm việc.
      required: [started_at, ended_at, reason]
      properties:
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        reason: { type: string, enum: [idle, blur, hidden, pause] }
    ReviewPolicy:
      type: object
      required: [policy_version, source, decision_status, lease_ttl_seconds, resume_reservation_seconds, idle_threshold_seconds, idle_gap_rule, immediate_exclusion_reasons, renew_on]
      properties:
        policy_version: { type: string }
        source: { type: string }
        decision_status: { type: string }
        lease_ttl_seconds: { type: integer }
        resume_reservation_seconds: { type: integer }
        idle_threshold_seconds: { type: integer }
        idle_gap_rule: { type: string }
        immediate_exclusion_reasons: { type: array, items: { type: string } }
        renew_on: { type: string }
    VerificationLineageItem:
      type: object
      required: [verification_id, rework_id, recheck_run_id, outcome, revision, verified_at]
      properties:
        verification_id: { type: integer }
        rework_id: { type: integer }
        recheck_run_id: { type: integer }
        outcome: { type: string, enum: [pass, fail] }
        revision: { type: string }
        verified_at: { type: string, format: date-time }
    SelectedFinalSource:
      type: object
      required: [cvat_job_id, rework_id, verification_id, source_run_id, source_revision]
      properties:
        cvat_job_id: { type: integer }
        rework_id: { type: integer }
        verification_id: { type: integer }
        source_run_id: { type: integer }
        source_revision: { type: string }
    RunDetail:
      allOf:
        - $ref: "#/components/schemas/Run"
        - type: object
          required: [verification_lineage, selected_final_sources, operational_source]
          properties:
            verification_lineage:
              type: array
              items: { $ref: "#/components/schemas/VerificationLineageItem" }
            selected_final_sources:
              type: array
              items: { $ref: "#/components/schemas/SelectedFinalSource" }
            operational_source:
              type: object
              additionalProperties: true
              description: Gồm scope_complete và blocked_reasons (DEC-019 P07) — mảng đầy đủ mọi lý do đang chặn nguồn, không trùng, sắp xếp cố định, rỗng khi scope_complete
    DecisionCase:
      type: object
      required: [id, issue_id, outcome, actor_user_id, rule_id, correct_label, reason, case_version, created_at]
      properties:
        id: { type: integer }
        issue_id: { type: integer }
        outcome: { type: string, enum: [confirm, reject, guideline_gap] }
        actor_user_id: { type: integer }
        rule_id: { type: string }
        correct_label: { type: string, nullable: true }
        reason: { type: string }
        case_version: { type: string }
        created_at: { type: string, format: date-time }
    DecisionCaseHistoryItem:
      type: object
      required: [id, case_version, outcome, actor_user_id, created_at]
      properties:
        id: { type: integer }
        case_version: { type: string }
        outcome: { type: string, enum: [confirm, reject, guideline_gap] }
        actor_user_id: { type: integer }
        created_at: { type: string, format: date-time }
    DecisionCaseDetail:
      allOf:
        - $ref: "#/components/schemas/DecisionCase"
        - type: object
          required: [history]
          properties:
            history: { type: array, items: { $ref: "#/components/schemas/DecisionCaseHistoryItem" } }
    PaginatedDecisionCaseList:
      type: object
      required: [next, previous, results]
      properties:
        next: { type: string, nullable: true }
        previous: { type: string, nullable: true }
        results: { type: array, items: { $ref: "#/components/schemas/DecisionCase" } }
    ReworkRead:
      type: object
      required: [id, dataset_id, issue_id, frame_id, annotator_user_id, created_by_user_id, status, instruction, severity, original_revision, submitted_revision, recheck_run_id, due_at, cvat_deep_link, submitted_at, resolved_at, created_at, updated_at, round_count]
      properties:
        id: { type: integer }
        dataset_id: { type: integer }
        issue_id: { type: integer }
        frame_id: { type: integer }
        annotator_user_id: { type: integer }
        created_by_user_id: { type: integer }
        status: { type: string, enum: [fix_pending, recheck_pending, resolved, reopened] }
        instruction: { type: string }
        severity: { $ref: "#/components/schemas/Severity" }
        original_revision: { type: string }
        submitted_revision: { type: string, nullable: true }
        recheck_run_id: { type: integer, nullable: true }
        due_at: { type: string, format: date-time }
        cvat_deep_link: { type: string }
        submitted_at: { type: string, format: date-time, nullable: true }
        resolved_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        round_count: { type: integer, minimum: 0 }
    ReworkDetail:
      allOf:
        - $ref: "#/components/schemas/ReworkRead"
        - type: object
          required: [review_state, timeline]
          properties:
            review_state: { type: string, enum: [unreviewed, in_review, incomplete, reviewed, awaiting_followup, completed] }
            timeline: { type: array, items: { $ref: "#/components/schemas/ReworkRound" } }
    ReworkCurrentRevision:
      type: object
      required: [rework_id, cvat_job_id, revision_sha256, original_revision, unchanged, read_at]
      properties:
        rework_id: { type: integer }
        cvat_job_id: { type: integer }
        revision_sha256: { type: string, minLength: 64, maxLength: 64 }
        original_revision: { type: string }
        unchanged: { type: boolean }
        rework_status: { type: string, enum: [fix_pending, recheck_pending, resolved, reopened] }
        read_at: { type: string, format: date-time }
    ReworkRound:
      type: object
      required: [round, revision, snapshot_id, recheck_run_id, recheck_run_status, submitted_at, verification, result_status]
      properties:
        round: { type: integer }
        revision: { type: string }
        snapshot_id: { type: integer }
        recheck_run_id: { type: integer }
        recheck_run_status: { type: string }
        submitted_at: { type: string, format: date-time, nullable: true }
        verification:
          type: object
          nullable: true
          required: [id, outcome, verifier_user_id, reason, verified_at]
          properties:
            id: { type: integer }
            outcome: { type: string, enum: [pass, fail] }
            verifier_user_id: { type: integer }
            reason: { type: string }
            verified_at: { type: string, format: date-time }
        result_status: { type: string, enum: [fix_pending, recheck_pending, resolved, reopened] }
    PaginatedReworkList:
      type: object
      required: [next, previous, results, counts]
      properties:
        next: { type: string, nullable: true }
        previous: { type: string, nullable: true }
        results: { type: array, items: { $ref: "#/components/schemas/ReworkRead" } }
        counts:
          type: object
          description: Số rework theo status trong phạm vi nhìn thấy
          additionalProperties: { type: integer }
    EffortEventReceipt:
      type: object
      required: [accepted, duplicates]
      properties:
        accepted: { type: integer, minimum: 0 }
        duplicates: { type: integer, minimum: 0 }
    EvaluationCreate:
      type: object
      required: [snapshot_id, run_id, reference_id, score_version, parameters]
      properties:
        snapshot_id: { type: integer }
        run_id: { type: integer }
        reference_id: { type: integer }
        score_version: { type: string }
        experiment_id: { type: integer, nullable: true }
        parameters: { type: object, additionalProperties: true }
    Evaluation:
      type: object
      required: [id, status, snapshot_id, run_id, reference_id, score_version, parameters, created_by, created_at]
      properties:
        id: { type: integer }
        status: { type: string, enum: [queued, running, completed, failed, insufficient_sample] }
        snapshot_id: { type: integer }
        run_id: { type: integer }
        reference_id: { type: integer }
        score_version: { type: string }
        experiment_id: { type: integer, nullable: true }
        parameters: { type: object, additionalProperties: true }
        metrics:
          type: object
          nullable: true
          additionalProperties: { $ref: "#/components/schemas/MetricValue" }
          description: "KPI-1, KPI-2, KPI-2b, G-1…G-4, P-1 (Precision của candidate = Issue từ candidate đã xác nhận / đã có quyết định), C-1 (Benchmark coverage = frame Snapshot có trong Benchmark ready mới nhất / frame Snapshot); thiếu mẫu dùng status=not_checked hoặc insufficient_sample (CR-119)."
        leakage_check: { type: string, enum: [passed, failed, not_checked] }
        created_by: { type: integer }
        created_at: { type: string, format: date-time }
    MetricValue:
      type: object
      required: [status, sample_size, denominator, method]
      properties:
        status: { type: string, enum: [computed, not_checked, insufficient_sample] }
        value: { type: number, nullable: true }
        sample_size: { type: integer, minimum: 0 }
        denominator: { type: integer, minimum: 0 }
        method: { type: string }
        confidence_interval:
          type: array
          nullable: true
          minItems: 2
          maxItems: 2
          items: { type: number }
        details:
          type: object
          additionalProperties: true
          description: "Chi tiết theo metric (CR-119): P-1 có by_engine {engine: {confirmed, decided, value}}; C-1 có benchmark_id (null khi chưa có Benchmark ready)."

    # ------------------------------------------------------------ gate/report
    GateConditionName:
      type: string
      enum: [coverage, open_critical_issues, rework_verified, residual, agreement]
    GateCondition:
      type: object
      required: [name, status, observed, threshold]
      properties:
        name: { $ref: "#/components/schemas/GateConditionName" }
        status: { type: string, enum: [passed, failed, not_checked, waived] }
        observed: { type: number, nullable: true }
        threshold: { type: number }
        waiver_id: { type: integer, nullable: true }
        reason: { type: string, nullable: true }
    GateResult:
      type: object
      required: [run_id, source_run_id, source_reason, status, conditions]
      properties:
        run_id: { type: integer }
        source_run_id: { type: integer }
        source_reason: { type: string, description: Lý do dùng run gốc nếu run cuối chưa đủ điều kiện }
        status: { type: string, enum: [passed, failed, not_checked] }
        conditions:
          type: array
          items: { $ref: "#/components/schemas/GateCondition" }
    WaiverCreate:
      type: object
      required: [run_id, condition, reason, evidence, expires_at]
      properties:
        run_id: { type: integer }
        condition: { $ref: "#/components/schemas/GateConditionName" }
        reason: { type: string, minLength: 1 }
        evidence: { type: string, minLength: 1 }
        expires_at: { type: string, format: date-time }
      description: condition chỉ coverage hoặc agreement; các điều kiện khác không được waiver.
    WaiverDecision:
      type: object
      required: [approved, reason]
      properties:
        approved: { type: boolean }
        reason: { type: string, minLength: 1 }
    Waiver:
      type: object
      required: [id, run_id, condition, reason, evidence, expires_at, requested_by, status]
      properties:
        id: { type: integer }
        run_id: { type: integer }
        condition: { $ref: "#/components/schemas/GateConditionName" }
        reason: { type: string }
        evidence: { type: string }
        expires_at: { type: string, format: date-time }
        requested_by: { type: integer }
        approved_by: { type: integer, nullable: true }
        status: { type: string, enum: [pending, approved, rejected, expired] }
    EffectivenessReport:
      type: object
      required: [id, input_snapshot_id, reference_id, source_run_id, source_reason, metrics, risk_queue, random_queue, engine_coverage]
      properties:
        id: { type: integer }
        input_snapshot_id: { type: integer }
        reference_id: { type: integer }
        source_run_id: { type: integer }
        source_reason: { type: string }
        score_version: { type: string }
        metrics:
          type: object
          additionalProperties: { $ref: "#/components/schemas/MetricValue" }
        risk_queue: { type: object, additionalProperties: true }
        random_queue: { type: object, additionalProperties: true }
        engine_coverage:
          type: array
          items: { $ref: "#/components/schemas/LedgerEntry" }

    # ------------------------------------------------------------ phân trang
    PaginatedDatasetList:
      type: object
      required: [results]
      properties:
        next: { type: string, nullable: true }
        previous: { type: string, nullable: true }
        results:
          type: array
          items: { $ref: "#/components/schemas/Dataset" }
    ConfigVersionCreate:
      type: object
      required: [name, engines]
      properties:
        name: { type: string, minLength: 1 }
        engines:
          type: object
          additionalProperties: true
          description: Cấu hình theo engine (bật/tắt, tham số); không chứa secret.
        thresholds:
          type: object
          additionalProperties: true
          description: >-
            Khoá classification_routing (M04C-01, tên classification-routing-v0) gồm score_threshold
            và margin_threshold trong [0, 1]; đây là ngưỡng định tuyến tạm, không phải ngưỡng
            quality hay calibration.
        models:
          type: object
          additionalProperties: true
          description: >-
            Model/artifact tham chiếu theo version đã khoá. Khoá vlm (CR-116) gồm provider
            (openai_compatible hoặc dashscope), model (allowlist, hiện chỉ qwen3-vl-plus; ID khác
            chỉ thêm sau khi xác minh với provider), base_url (https, host trong allowlist và
            đúng đường dẫn của host đó, không port/userinfo/query/fragment), prompt_version,
            timeout_seconds (1 đến 120), max_attempts (1 đến 3), budget {max_calls} (0 đến 10000)
            và api_key_env (tuỳ chọn; là TÊN biến môi trường, không phải khoá; bị ràng với host:
            DashScope chỉ dùng DASHSCOPE_API_KEY, api.shopaikey.com chỉ dùng VLM_API_KEY, mặc định
            theo host). connection_id (tuỳ chọn, số nguyên dương) tham chiếu kết nối VLM đã lưu;
            worker lấy key mã hóa từ kết nối và kiểm tra provider/model/base_url/api_key_env khớp.
            Không cung cấp models.vlm khi bật engine thì cấu hình mới lấy kết nối hiện tại.
            provider cũng phải khớp host (dashscope chỉ host DashScope, openai_compatible
            chỉ host cổng); sai cặp bị từ chối 400 và publish trả 422. Host api.shopaikey.com là
            cổng OpenAI-compatible của bên thứ ba: crop ảnh đi qua bên trung gian và cần PO xác nhận
            chính sách dữ liệu trước khi chạy thật. Không nhận api_key hay prompt. Khoá giống secret
            (api_key, secret, token, password, authorization...) bị từ chối 400 ở mọi vùng
            engines/thresholds/models; publish kiểm lại và trả 422.
    ConfigVersion:
      type: object
      required: [id, name, status, engines, created_by, created_at]
      x-labelx-trace: [FR-ENG-01]
      properties:
        id: { type: integer }
        name: { type: string }
        status: { type: string, enum: [draft, published] }
        engines: { type: object, additionalProperties: true }
        thresholds: { type: object, additionalProperties: true }
