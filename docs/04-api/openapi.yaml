        candidates: { type: integer, description: Số candidate của run trong Task }
        confirmed_issues: { type: integer, description: "Issue ở trạng thái confirmed, fix_pending, recheck_pending, resolved hoặc reopened" }
        gate_status:
          type: string
          nullable: true
          enum: [passed, partial, blocked, null]
          description: Chỉ để hiển thị, không thay Quality Gate của run. blocked khi còn Issue critical chưa đóng; partial khi coverage < 100%; null khi coverage null (DEC-023).
