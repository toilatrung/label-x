# LabelX API — contract M13 v1 (T-001, epic E-01).
# Nguồn sự thật cho frontend sinh type và mock tới khi backend có view thật; khi view có, schema
# drf-spectacular tại /api/schema/ phải khớp tệp này (đổi tệp này trước, rồi mới đổi code).
# Văn bản giải thích: docs/04-api/rest-api.html, state-machines.html, rbac-matrix.html.
# Quy ước mở rộng:
#   x-labelx-trace: mã FR/BR/UC/NFR trong SRS mà operation thực hiện (bắt buộc, có test kiểm).
#   x-labelx-roles: vai trò được gọi, theo docs/04-api/rbac-matrix.html (bắt buộc, có test kiểm).
#   x-labelx-transition: event trong docs/04-api/state-machines.html mà operation kích hoạt.
openapi: 3.0.3
info:
  title: LabelX API
  version: 0.1.0
  description: |
    Quality Control cho annotation CVAT — contract M13 v1.

    Xác thực bằng session LabelX (cookie `sessionid`); request ghi gửi header `X-CSRFToken`
    lấy từ cookie `csrftoken` (gọi `GET /api/auth/csrf/` trước khi đăng nhập).
    Mọi lỗi trả `Error` với `code`, `message`, `request_id` (SRS §9.3.1).
    Đường dẫn có dấu `/` cuối theo quy ước Django REST framework; `/api/snapshots/` trong
    contract này là `/api/snapshots` của SRS tab:api.
servers:
  - url: http://localhost:8000
    description: Backend dev
tags:
  - name: auth
    description: Phiên đăng nhập LabelX (E-02)
  - name: datasets
    description: Dataset và cây task/job để chọn phạm vi snapshot
  - name: snapshots
    description: Snapshot bất biến từ CVAT (UC-01, module SNP)
  - name: runs
    description: QC Run, ledger, ranking (UC-02, UC-03, module ENG/AGG/RNK)
  - name: guidelines
    description: Tra rule guideline tĩnh (module GDL, CR-101)
  - name: config
    description: Config version engine, ngưỡng, model (FR-ENG-01)
  - name: review
    description: Hàng đợi, lease, frame (UC-04, UC-05, module REV)
  - name: rework
    description: Yêu cầu sửa và xác minh trên revision mới (UC-07)
  - name: evaluation
    description: Reference, effort và đánh giá KPI (UC-08, UC-09, UC-10)
  - name: gate
    description: Điều kiện gate và waiver (UC-14)
  - name: reports
    description: Báo cáo hiệu quả có provenance (UC-11)

paths:
  # ------------------------------------------------------------------ auth
  /api/auth/csrf/:
    get:
      operationId: auth_csrf
      tags: [auth]
      summary: Đặt cookie csrftoken
      description: Không cần đăng nhập. Frontend gọi một lần trước POST /api/auth/login/.
      security: []
      x-labelx-trace: [FR-SEC-01]
      x-labelx-roles: [anonymous]
      responses:
        "204":
          description: Đã đặt cookie csrftoken
  /api/auth/login/:
    post:
      operationId: auth_login
      tags: [auth]
      summary: Đăng nhập, tạo session
      security: []
      x-labelx-trace: [FR-SEC-01, FR-SEC-05, UC-13]
      x-labelx-roles: [anonymous]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Đăng nhập thành công; trả session hiện tại
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/auth/logout/:
    post:
      operationId: auth_logout
      tags: [auth]
      summary: Đăng xuất, huỷ session
      description: Lease đang giữ không bị trả; nó hết hạn theo FR-REV-04.
      x-labelx-trace: [FR-SEC-01, FR-SEC-05]
      x-labelx-roles: [authenticated]
      responses:
        "204":
          description: Đã đăng xuất (gọi lại khi đã đăng xuất cũng trả 204)
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/auth/session/:
    get:
      operationId: auth_session
      tags: [auth]
      summary: Người dùng, vai trò theo scope, identity mapping
      description: |
        Frontend dùng để guard route và ẩn menu theo vai trò. Ẩn menu chỉ là tiện ích;
        backend vẫn kiểm quyền ở mọi endpoint (FR-SEC-01).
      x-labelx-trace: [FR-SEC-01, FR-SEC-02]
      x-labelx-roles: [authenticated]
      responses:
        "200":
          description: Session hiện tại
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/auth/workflow-permissions/:
    get:
      operationId: auth_workflow_permissions
      tags: [auth]
      summary: Ma trận phân quyền và quy tắc workflow
      description: |
        Cung cấp cấu hình ma trận phân quyền theo vai trò (7 vai trò) và các quy tắc workflow
        (anti-self-review, super admin override, separation of duties) phục vụ màn hình WorkflowPermissions.
      x-labelx-trace: [FR-SEC-01, FR-SEC-06]
      x-labelx-roles: [qa_lead, qc_admin, super_admin]
      responses:
        "200":
          description: Ma trận phân quyền và quy tắc workflow
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowPermissions" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # -------------------------------------------------------------- datasets
  /api/datasets/:
    get:
      operationId: datasets_list
      tags: [datasets]
      summary: Dataset trong scope người gọi
      description: Đường dẫn đề xuất (rest-api.html §4.2); danh sách luôn lọc theo scope.
      x-labelx-trace: [UC-01, FR-SEC-01]
      x-labelx-roles: [annotator, reviewer, qa_lead, qc_admin, super_admin, product_owner, data_model_owner]
      parameters:
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Trang dataset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedDatasetList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /api/datasets/{id}/tasks/:
    get:
      operationId: datasets_tasks
      tags: [datasets]
      summary: Cây task/job CVAT của dataset để chọn phạm vi snapshot
      description: Đọc qua adapter CVAT chỉ đọc (FR-SNP-01). Đường dẫn đề xuất (rest-api.html §4.2).
      x-labelx-trace: [UC-01, FR-SNP-01, FR-SNP-05]
      x-labelx-roles: [qa_lead, qc_admin, super_admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Task và job
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CvatTask" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }

  # ------------------------------------------------------------- snapshots
  /api/snapshots/:
    get:
      operationId: snapshots_list
      tags: [snapshots]
      summary: Danh sách snapshot của dataset
      x-labelx-trace: [FR-SNP-03, FR-SNP-05, FR-SNP-07]
      x-labelx-roles: [qa_lead, qc_admin, super_admin]
      parameters:
        - name: dataset_id
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Danh sách snapshot theo phạm vi dataset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedSnapshotList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: snapshots_create
      tags: [snapshots]
      summary: Tạo snapshot cho một phạm vi (chạy nền)
      x-labelx-trace: [UC-01, FR-SNP-03, FR-SNP-04, FR-SNP-05]
      x-labelx-roles: [qa_lead, super_admin]
      x-labelx-transition: snapshot.create
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SnapshotCreate" }
      responses:
        "202":
          description: Đã nhận; theo dõi bằng GET /api/snapshots/{id}/
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnapshotAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          $ref: "#/components/responses/Conflict"
  /api/snapshots/{id}/:
    get:
      operationId: snapshots_retrieve
      tags: [snapshots]
      summary: Trạng thái, hash từng job, hash tổng, drift
      x-labelx-trace: [FR-SNP-03, FR-SNP-04, FR-SNP-05, FR-SNP-07]
      x-labelx-roles: [qa_lead, qc_admin, super_admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Snapshot" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ------------------------------------------------------------------ runs
  /api/config-versions/:
    get:
      operationId: config_versions_list
      tags: [config]
      summary: Danh sách config version (engine, ngưỡng, model)
      x-labelx-trace: [FR-ENG-01]
      x-labelx-roles: [qa_lead, qc_admin, super_admin]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [draft, published] }
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Trang config version, mới nhất trước
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedConfigVersionList" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: config_versions_create
      tags: [config]
      summary: Tạo config version nháp
      description: Bản nháp sửa được; bản đã publish không sửa được (đổi cấu hình = tạo version mới).
      x-labelx-trace: [FR-ENG-01]
      x-labelx-roles: [qc_admin, super_admin]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigVersionCreate" }
      responses:
        "201":
          description: Config version nháp
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigVersion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/config-versions/{id}/publish/:
    post:
      operationId: config_versions_publish
      tags: [config]
      summary: Publish config version
      description: Chỉ từ draft; publish lại bản đã publish trả 409 INVALID_TRANSITION. Ghi audit cùng transaction.
      x-labelx-trace: [FR-ENG-01, FR-SEC-05]
      x-labelx-roles: [qc_admin, super_admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Config version đã publish
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigVersion" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/runs/:
    get:
      operationId: runs_list
      tags: [runs]
      summary: Lịch sử QC Run
      description: Đường dẫn đề xuất (rest-api.html §4.2).
      x-labelx-trace: [FR-ENG-01, FR-AGG-05]
      x-labelx-roles: [qa_lead, qc_admin, super_admin]
      parameters:
        - name: dataset
          in: query
          schema: { type: integer }
        - name: snapshot
          in: query
          schema: { type: integer }
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Trang run, mới nhất trước
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedRunList" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: runs_create
      tags: [runs]
      summary: Tạo QC Run trên snapshot locked và config version đã publish
      x-labelx-trace: [UC-02, FR-ENG-01, FR-AGG-02]
      x-labelx-roles: [qa_lead, super_admin]
      x-labelx-transition: run.create
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunCreate" }
      responses:
        "201":
          description: Run ở trạng thái queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/runs/{id}/:
    get:
      operationId: runs_retrieve
      tags: [runs]
      summary: Trạng thái run, trạng thái từng engine, is_final
      x-labelx-trace: [FR-ENG-01, FR-AGG-05, FR-RWK-06]
      x-labelx-roles: [reviewer, qa_lead, qc_admin, super_admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/runs/{id}/cancel/:
    post:
      operationId: runs_cancel
      tags: [runs]
      summary: Huỷ run queued/running
      description: Gọi lại khi run đã cancelled trả 200 (idempotent tự nhiên).
      x-labelx-trace: [UC-02, FR-AGG-05]
      x-labelx-roles: [qa_lead, super_admin]
      x-labelx-transition: run.cancel
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Run sau khi huỷ
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/runs/{id}/retry-failed/:
    post:
      operationId: runs_retry_failed
      tags: [runs]
      summary: Chạy lại các đơn vị failed của run partial
      description: Idempotent theo work_unit.idempotency_key; không tạo candidate/issue trùng.
      x-labelx-trace: [FR-AGG-02, FR-AGG-04, NFR-05]
      x-labelx-roles: [qa_lead, super_admin]
      x-labelx-transition: run.retry_failed
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "202":
          description: Run quay lại running
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/runs/{id}/ledger/:
    get:
      operationId: runs_ledger
      tags: [runs]
      summary: Coverage ledger theo engine
      x-labelx-trace: [FR-AGG-04, FR-AGG-05, FR-RPT-04]
      x-labelx-roles: [qa_lead, qc_admin, super_admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Một dòng mỗi engine
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LedgerEntry" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/runs/{id}/ranking/:
    get:
      operationId: runs_ranking
      tags: [runs]
      summary: Ranking frame theo s(f), có lọc
      description: |
        Người lập GT của tập đánh giá nhận 403 FORBIDDEN (FR-EVL-02, BR-10).
        Frame thiếu bằng chứng vẫn có trong danh sách, mang cờ missing_evidence (FR-RNK-06).
      x-labelx-trace: [UC-03, FR-RNK-01, FR-RNK-05, FR-RNK-06, FR-REV-01, FR-REV-02, FR-EVL-02]
      x-labelx-roles: [reviewer, qa_lead, super_admin]
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: queue
          in: query
          schema: { $ref: "#/components/schemas/QueueName" }
        - name: family
          in: query
          schema: { $ref: "#/components/schemas/IssueFamily" }
        - name: origin
          in: query
          schema: { $ref: "#/components/schemas/IssueOrigin" }
        - name: review_state
          in: query
          schema: { $ref: "#/components/schemas/FrameReviewState" }
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Trang frame theo rank tăng dần
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedRankedFrameList" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ------------------------------------------------------------ guidelines
  /api/guidelines/rules/:
    get:
      operationId: guidelines_rules_list
      tags: [guidelines]
      summary: Tra rule theo nhóm lỗi, lớp, cặp lớp
      description: Không dùng retrieval ngữ nghĩa (FR-GDL-04). Mặc định guideline version mới nhất.
      x-labelx-trace: [FR-GDL-04, UC-12]
      x-labelx-roles: [reviewer, qa_lead, qc_admin, super_admin]
      parameters:
        - $ref: "#/components/parameters/GuidelineVersion"
        - name: family
          in: query
          schema: { $ref: "#/components/schemas/IssueFamily" }
        - name: class_name
          in: query
          schema: { type: string }
        - name: paired_class
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Trang rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedGuidelineRuleList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/guidelines/mappings/:
    get:
      operationId: guidelines_mappings_list
      tags: [guidelines]
      summary: Tra mapping nhóm lỗi/lớp tới rule ID
      x-labelx-trace: [FR-GDL-02, FR-SEC-01]
      x-labelx-roles: [reviewer, qa_lead, qc_admin, super_admin]
      parameters:
        - $ref: "#/components/parameters/GuidelineVersion"
        - name: family
          in: query
          schema: { $ref: "#/components/schemas/IssueFamily" }
        - name: class_name
          in: query
          schema: { type: string }
        - name: paired_class
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Trang mapping chỉ đọc
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedRuleMappingList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/guidelines/rules/{rule_id}/:
    get:
      operationId: guidelines_rules_retrieve
      tags: [guidelines]
      summary: Rule theo guideline version của snapshot
      x-labelx-trace: [FR-GDL-03, FR-GDL-04, FR-REV-07, UC-12]
      x-labelx-roles: [reviewer, qa_lead, qc_admin, super_admin]
      parameters:
        - name: rule_id
          in: path
          required: true
          schema: { type: string, example: VEH-03 }
        - $ref: "#/components/parameters/GuidelineVersion"
      responses:
        "200":
          description: Rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuidelineRule" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- review
  /api/queues/{name}/next/:
    post:
      operationId: queues_next
      tags: [review]
      summary: Cấp lease frame kế tiếp
      description: |
        Mỗi reviewer giữ tối đa một lease (DEC-002/BLOCKER-008). Nếu đang giữ một lease còn hạn
        thì trả lại chính lease đó (tab thứ hai nhận cùng frame). Frame "đang dở" (incomplete)
        được ưu tiên trả về reviewer cũ trong cửa sổ giữ chỗ (TBD-09). Bỏ qua frame mà người gọi
        là assignee tại snapshot (FR-REV-03). Thiếu identity mapping → 403 IDENTITY_MAPPING_MISSING.
      x-labelx-trace: [UC-04, FR-REV-03, FR-REV-04, FR-SEC-02, FR-SEC-03]
      x-labelx-roles: [reviewer, qa_lead, super_admin]
      x-labelx-transition: frame.claim
      parameters:
        - name: name
          in: path
          required: true
          schema: { $ref: "#/components/schemas/QueueName" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QueueNextRequest" }
      responses:
        "200":
          description: Lease và frame
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeaseGrant" }
        "204":
          description: Hàng đợi hết frame phù hợp
