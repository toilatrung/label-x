    # ------------------------------------------------------ MBE-00: review & escalation
    FrameWorkspace:
      allOf:
        - $ref: "#/components/schemas/FrameIssues"
        - type: object
          properties:
            lease:
              allOf: [{ $ref: "#/components/schemas/Lease" }]
              nullable: true
