      type: object
      required: [results]
      properties:
        next: { type: string, nullable: true }
        previous: { type: string, nullable: true }
        results:
          type: array
          items: { $ref: "#/components/schemas/TaskQuality" }
    CandidateCategories:
      type: object
      required: [run_id, total, categories]
      properties:
        run_id: { type: integer }
        total: { type: integer }
        categories:
          type: array
          items:
            type: object
            required: [family, count]
            properties:
              family: { $ref: "#/components/schemas/IssueFamily" }
              count: { type: integer }
              share: { type: number, nullable: true }
    DatasetSummary:
      type: object
      required: [dataset_id, name, snapshot_count, open_issue_count]
      properties:
        dataset_id: { type: integer }
        name: { type: string }
        snapshot_count: { type: integer }
        latest_snapshot_id: { type: integer, nullable: true }
        latest_run_id: { type: integer, nullable: true }
        open_issue_count: { type: integer }
        reviewed_ratio: { type: number, nullable: true }
    PaginatedDatasetSummaryList:
      type: object
      required: [results]
      properties:
        next: { type: string, nullable: true }
        previous: { type: string, nullable: true }
        results:
          type: array
          items: { $ref: "#/components/schemas/DatasetSummary" }
    DatasetRevision:
      type: object
      required: [revision, snapshot_id, frame_count, created_at]
      properties:
        revision: { type: string }
        snapshot_id: { type: integer, description: Snapshot locked mới nhất có revision này }
        frame_count: { type: integer }
        created_at: { type: string, format: date-time }
    PaginatedDatasetRevisionList:
      type: object
      required: [results]
      properties:
        next: { type: string, nullable: true }
        previous: { type: string, nullable: true }
        results:
          type: array
          items: { $ref: "#/components/schemas/DatasetRevision" }

    # ------------------------------------------------------ MBE-00: report, release, lineage
    ReportExportFormat:
      type: string
      enum: [pdf, csv, json]
    ReportExportCreate:
      type: object
      required: [format]
      properties:
        format: { $ref: "#/components/schemas/ReportExportFormat" }
    ReportExport:
      type: object
      required: [id, run_id, format, status, created_at]
      properties:
        id: { type: integer }
        run_id: { type: integer }
        format: { $ref: "#/components/schemas/ReportExportFormat" }
        status: { type: string, enum: [queued, running, completed, failed] }
        download_url: { type: string, format: uri, nullable: true }
        error: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
    RunReport:
      type: object
      required: [run_id, snapshot_id, source_run_id, source_reason, generated_at, metrics, engine_coverage, exports]
      properties:
        run_id: { type: integer }
        snapshot_id: { type: integer }
        source_run_id: { type: integer }
        source_reason: { type: string }
        score_version: { type: string, nullable: true }
        generated_at: { type: string, format: date-time }
        metrics:
          allOf: [{ $ref: "#/components/schemas/RunMetrics" }]
        gate:
          allOf: [{ $ref: "#/components/schemas/GateResult" }]
          nullable: true
        engine_coverage:
          type: array
          items: { $ref: "#/components/schemas/LedgerEntry" }
        release_id: { type: integer, nullable: true }
        exports:
          type: array
          items: { $ref: "#/components/schemas/ReportExport" }
    RunLineageNode:
      type: object
      required: [run_id, kind, snapshot_id, created_at]
      properties:
        run_id: { type: integer }
        kind: { type: string, enum: [original, rework_verification, final] }
        snapshot_id: { type: integer }
        rework_id: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
    RunLineage:
      type: object
      required: [run_id, origin_run_id, final_run_id, chain]
      properties:
        run_id: { type: integer }
        origin_run_id: { type: integer, nullable: true }
        final_run_id: { type: integer, nullable: true }
        chain:
          type: array
          description: Từ run gốc tới run cuối
          items: { $ref: "#/components/schemas/RunLineageNode" }
    Release:
      type: object
      required: [id, run_id, snapshot_id, config_version_id, version_tag, status, created_by, created_at]
      properties:
        id: { type: integer }
        run_id: { type: integer }
        snapshot_id: { type: integer }
        config_version_id: { type: integer }
        version_tag: { type: string }
        status: { type: string, enum: [pending, approved] }
        gate_status: { type: string, enum: [passed, failed, not_checked] }
        created_by: { type: integer }
        created_at: { type: string, format: date-time }
        approved_by: { type: integer, nullable: true }
        approved_at: { type: string, format: date-time, nullable: true }
    PaginatedReleaseList:
      type: object
      required: [results]
      properties:
        next: { type: string, nullable: true }
        previous: { type: string, nullable: true }
        results:
          type: array
          items: { $ref: "#/components/schemas/Release" }
    ReleaseApprove:
      type: object
      properties:
        note: { type: string }
    ReleaseManifest:
      type: object
      required: [release_id, generated_at, checksum, snapshot_id, run_id, config_version_id, artifacts]
      properties:
        release_id: { type: integer }
        generated_at: { type: string, format: date-time }
        checksum: { type: string, description: SHA-256 của manifest chuẩn hoá }
        snapshot_id: { type: integer }
        run_id: { type: integer }
        config_version_id: { type: integer }
        guideline_version: { type: string, nullable: true }
        score_version: { type: string, nullable: true }
        gate:
          allOf: [{ $ref: "#/components/schemas/GateResult" }]
          nullable: true
        artifacts:
          type: array
          items:
            type: object
            required: [name, sha256]
            properties:
              name: { type: string }
              sha256: { type: string }
              size_bytes: { type: integer }

security:
  - sessionAuth: []
