        model: { type: string, enum: [qwen3-vl-plus] }
        api_key: { type: string, writeOnly: true, minLength: 1, maxLength: 4096 }
        confidence_threshold: { type: number, minimum: 0, maximum: 1, description: Bỏ qua để giữ ngưỡng đã lưu; mặc định ban đầu 0.85. }
