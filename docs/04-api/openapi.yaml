# LabelX API — contract M13 v1 (T-001, epic E-01).
# Nguồn sự thật cho frontend sinh type và mock tới khi backend có view thật; khi view có, schema
# drf-spectacular tại /api/schema/ phải khớp tệp này (đổi tệp này trước, rồi mới đổi code).
# Văn bản giải thích: docs/04-api/rest-api.html, state-machines.html, rbac-matrix.html.
# Quy ước mở rộng:
#   x-labelx-trace: mã FR/BR/UC/NFR trong SRS mà operation thực hiện (bắt buộc, có test kiểm).
#   x-labelx-roles: vai trò được gọi, theo docs/04-api/rbac-matrix.html (bắt buộc, có test kiểm).
#   x-labelx-transition: event trong docs/04-api/state-machines.html mà operation kích hoạt.
openapi: 3.0.3
info:
  title: LabelX API
  version: 0.1.0
  description: |
    Quality Control cho annotation CVAT — contract M13 v1.

    Xác thực bằng session LabelX (cookie `labelx_sessionid`); request ghi gửi header `X-CSRFToken`
    lấy từ cookie `labelx_csrftoken` (gọi `GET /api/auth/csrf/` trước khi đăng nhập).
    Mọi lỗi trả `Error` với `code`, `message`, `request_id` (SRS §9.3.1).
    Đường dẫn có dấu `/` cuối theo quy ước Django REST framework; `/api/snapshots/` trong
    contract này là `/api/snapshots` của SRS tab:api.
servers:
  - url: http://localhost:8000
    description: Backend dev
tags:
  - name: auth
    description: Phiên đăng nhập LabelX (E-02)
  - name: datasets
    description: Dataset và cây task/job để chọn phạm vi snapshot
  - name: snapshots
    description: Snapshot bất biến từ CVAT (UC-01, module SNP)
  - name: runs
    description: QC Run, ledger, ranking (UC-02, UC-03, module ENG/AGG/RNK)
  - name: guidelines
    description: Tra rule guideline tĩnh (module GDL, CR-101)
  - name: config
    description: Config version engine, ngưỡng, model (FR-ENG-01)
  - name: ops
    description: Metric vận hành nội bộ, không thuộc API nghiệp vụ (NFR-12, CR-109)
  - name: review
    description: Hàng đợi, lease, frame (UC-04, UC-05, module REV)
  - name: rework
    description: Yêu cầu sửa và xác minh trên revision mới (UC-07)
  - name: evaluation
    description: Reference, effort và đánh giá KPI (UC-08, UC-09, UC-10)
  - name: gate
    description: Điều kiện gate và waiver (UC-14)
  - name: reports
    description: Báo cáo hiệu quả có provenance (UC-11)
  - name: releases
    description: Release, manifest và phê duyệt (UC-14, MBE-03)
  - name: audit
    description: Mẫu kiểm định và benchmark (MBE-04)
  - name: calibration
    description: Hiệu chỉnh reviewer và model (MBE-04)

paths:
  /api/gpu-worker/config/:
    get:
      operationId: gpu_worker_config_retrieve
      x-labelx-trace: [FR-ENG-01, FR-ENG-05, FR-SEC-01]
      x-labelx-roles: [super_admin, qc_admin]
      tags: [gpu-worker]
      summary: Đọc cấu hình GPU Worker và các credential reference được phép (admin toàn hệ thống).
      responses:
        "200":
          description: Cấu hình hiện tại; config null nếu chưa cấu hình. Không chứa token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerEnvelope" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: gpu_worker_config_update
      x-labelx-trace: [FR-ENG-01, FR-ENG-05, FR-SEC-01, FR-SEC-05]
      x-labelx-roles: [super_admin, qc_admin]
      tags: [gpu-worker]
      summary: Tạo revision mới; revision=0 cho lần đầu, revision cũ trả 409. Không tự probe.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkerConfig" }
      responses:
        "200":
          description: Revision đã lưu và audit. Run đang chạy giữ revision cũ.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/gpu-worker/probe/:
    post:
      operationId: gpu_worker_probe
      x-labelx-trace: [FR-ENG-05, FR-SEC-01]
      x-labelx-roles: [super_admin, qc_admin]
      tags: [gpu-worker]
      summary: Kiểm tra revision đang chọn. HTTP 200 không đồng nghĩa ready; phải đọc state.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkerProbeRequest" }
      responses:
        "200":
          description: Trạng thái quan sát tại checked_at; không đảm bảo worker luôn online.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerProbe" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/ground-truth/{id}/preview/:
    get:
      operationId: ground_truth_preview
      summary: Xem annotation Ground Truth trước khi duyệt
      tags: [Evaluation]
      x-labelx-trace: [FR-EVL-01, FR-SEC-05]
      x-labelx-roles: [qa_lead, super_admin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Annotation đã kiểm tra checksum, trong phạm vi Dataset
          content:
            application/json:
              schema:
                type: object
                required: [reference_id, frames]
                properties:
                  reference_id: { type: integer }
                  frames: { type: array, items: { type: object, additionalProperties: true } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "410": { $ref: "#/components/responses/Gone" }
  /api/ground-truth/:
    get:
      operationId: ground_truth_current
      tags: [Evaluation]
      summary: Ground Truth hiện hành của Dataset
      x-labelx-trace: [FR-EVL-01, FR-SEC-05]
      x-labelx-roles: [qa_lead, super_admin]
      parameters:
        - { name: dataset_id, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Metadata Ground Truth hoặc null nếu chưa upload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroundTruthUpload" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: ground_truth_upload
      tags: [Evaluation]
      summary: Upload Ground Truth lưu tạm cho Metric
      description: File JSON labelx.metric.gt.v1, tối đa 20 MiB. QA Lead khác người upload khóa reference trước khi chạy. File tự xóa sau khi mọi run dùng nó đã hoàn tất và Metric checked; metadata và checksum được giữ lại. Chạy lại cần upload lại.
      x-labelx-trace: [FR-EVL-01, FR-EVL-04, FR-SEC-05]
      x-labelx-roles: [qa_lead, super_admin]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 128 } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [snapshot_id, file, mapping_version]
              properties:
                snapshot_id: { type: integer, minimum: 1 }
                file: { type: string, format: binary }
                mapping_version: { type: string, maxLength: 128 }
                matching_threshold: { type: number, minimum: 0, maximum: 1, default: 0.5 }
                minimum_area: { type: number, minimum: 0, default: 0 }
      responses:
        "201":
          description: Ground Truth đã upload, chờ duyệt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroundTruthUpload" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/guidelines/preview/:
    post:
      operationId: guidelines_preview
      x-labelx-trace: [FR-GDL-02]
      x-labelx-roles: [qc_admin, super_admin]
      tags:
      - guidelines
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuidelineFile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GuidelineFile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GuidelineFile'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuidelinePreview'
          description: ''
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/datasets/{id}/guideline/:
    get:
      operationId: datasets_guideline_retrieve
      x-labelx-trace: [FR-SNP-03, FR-GDL-02]
      x-labelx-roles: [qa_lead, qc_admin, super_admin, reviewer]
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - datasets
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetGuideline'
          description: ''
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: datasets_guideline_update
      x-labelx-trace: [FR-SNP-03, FR-GDL-02]
      x-labelx-roles: [qc_admin, super_admin]
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - datasets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetGuidelineUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DatasetGuidelineUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DatasetGuidelineUpdate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetGuideline'
          description: ''
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/guidelines/import/:
    post:
      operationId: guidelines_import
      x-labelx-trace: [FR-GDL-02]
      x-labelx-roles: [qc_admin, super_admin]
      tags:
      - guidelines
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuidelineImport'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GuidelineImport'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GuidelineImport'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuidelineImportResult'
          description: ''
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  # ------------------------------------------------------------------ auth
  /api/auth/csrf/:
    get:
      operationId: auth_csrf
      tags: [auth]
      summary: Đặt cookie labelx_csrftoken
      description: Không cần đăng nhập. Frontend gọi một lần trước POST /api/auth/login/.
      security: []
      x-labelx-trace: [FR-SEC-01]
      x-labelx-roles: [anonymous]
      responses:
        "204":
          description: Đã đặt cookie labelx_csrftoken
  /api/auth/login/:
    post:
      operationId: auth_login
      tags: [auth]
      summary: Đăng nhập, tạo session
      security: []
      x-labelx-trace: [FR-SEC-01, FR-SEC-05, UC-13]
      x-labelx-roles: [anonymous]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Đăng nhập thành công; trả session hiện tại
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/auth/logout/:
    post:
      operationId: auth_logout
      tags: [auth]
      summary: Đăng xuất, huỷ session
      description: Lease đang giữ không bị trả; nó hết hạn theo FR-REV-04.
      x-labelx-trace: [FR-SEC-01, FR-SEC-05]
      x-labelx-roles: [authenticated]
      responses:
        "204":
          description: Đã đăng xuất (gọi lại khi đã đăng xuất cũng trả 204)
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/auth/session/:
    get:
      operationId: auth_session
      tags: [auth]
      summary: Người dùng, vai trò theo scope, identity mapping
      description: |
        Frontend dùng để guard route và ẩn menu theo vai trò. Ẩn menu chỉ là tiện ích;
        backend vẫn kiểm quyền ở mọi endpoint (FR-SEC-01).
      x-labelx-trace: [FR-SEC-01, FR-SEC-02]
      x-labelx-roles: [authenticated]
      responses:
        "200":
          description: Session hiện tại
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/auth/profile/:
    get:
      operationId: auth_profile_retrieve
      tags: [auth]
      summary: Trạng thái token CVAT trong Hồ sơ của tài khoản hiện tại
      x-labelx-trace: [FR-SEC-01, FR-SEC-02]
      x-labelx-roles: [authenticated]
      responses:
        "200":
          description: Trạng thái token; không trả giá trị token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      operationId: auth_profile_update
      tags: [auth]
      summary: Lưu token CVAT riêng của tài khoản hiện tại
      x-labelx-trace: [FR-SEC-01, FR-SEC-05]
      x-labelx-roles: [authenticated]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileUpdate" }
      responses:
        "200":
          description: Token được mã hóa và lưu; không trả giá trị token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

    delete:
      operationId: auth_profile_token_delete
      tags: [auth]
      summary: Xóa token CVAT đã lưu trong Hồ sơ của tài khoản hiện tại
      x-labelx-trace: [FR-SEC-01, FR-SEC-05]
      x-labelx-roles: [authenticated]
      responses:
        "200":
          description: Đã xóa token riêng; giữ cấu hình token mặc định của máy chủ nếu có
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/auth/workflow-permissions/:
    get:
      operationId: auth_workflow_permissions
      tags: [auth]
      summary: Ma trận phân quyền và quy tắc workflow
      description: |
        Cung cấp cấu hình ma trận phân quyền theo vai trò (7 vai trò) và các quy tắc workflow
        (anti-self-review, super admin override, separation of duties) phục vụ màn hình WorkflowPermissions.
      x-labelx-trace: [FR-SEC-01, FR-SEC-06]
      x-labelx-roles: [qa_lead, qc_admin, super_admin]
      responses:
        "200":
          description: Ma trận phân quyền và quy tắc workflow
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowPermissions" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # -------------------------------------------------------------- datasets
  /api/datasets/:
    get:
      operationId: datasets_list
      tags: [datasets]
      summary: Dataset trong scope người gọi
      description: Đường dẫn đề xuất (rest-api.html §4.2); danh sách luôn lọc theo scope.
      x-labelx-trace: [UC-01, FR-SEC-01]
      x-labelx-roles: [annotator, reviewer, qa_lead, qc_admin, super_admin, product_owner, data_model_owner]
      parameters:
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Trang dataset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedDatasetList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /api/datasets/{id}/tasks/:
    get:
      operationId: datasets_tasks
      tags: [datasets]
      summary: Cây task/job CVAT của dataset để chọn phạm vi snapshot
      description: Đọc qua adapter CVAT chỉ đọc (FR-SNP-01). Đường dẫn đề xuất (rest-api.html §4.2).
      x-labelx-trace: [UC-01, FR-SNP-01, FR-SNP-05]
      x-labelx-roles: [reviewer, qa_lead, qc_admin, super_admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Task và job
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CvatTask" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }

  # ------------------------------------------------------------- snapshots
  /api/snapshots/:
    get:
      operationId: snapshots_list
      tags: [snapshots]
      summary: Danh sách snapshot của dataset
      x-labelx-trace: [FR-SNP-03, FR-SNP-05, FR-SNP-07]
      x-labelx-roles: [qa_lead, qc_admin, super_admin]
      parameters:
        - name: dataset_id
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Danh sách snapshot theo phạm vi dataset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedSnapshotList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: snapshots_create
      tags: [snapshots]
      summary: Tạo snapshot cho một phạm vi (chạy nền)
      x-labelx-trace: [UC-01, FR-SNP-03, FR-SNP-04, FR-SNP-05]
      x-labelx-roles: [qa_lead, super_admin]
      x-labelx-transition: snapshot.create
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SnapshotCreate" }
      responses:
        "202":
          description: Đã nhận; theo dõi bằng GET /api/snapshots/{id}/
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnapshotAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          $ref: "#/components/responses/Conflict"
  /api/snapshots/{id}/:
    get:
      operationId: snapshots_retrieve
      tags: [snapshots]
      summary: Trạng thái, hash từng job, hash tổng, drift
      x-labelx-trace: [FR-SNP-03, FR-SNP-04, FR-SNP-05, FR-SNP-07]
      x-labelx-roles: [qa_lead, qc_admin, super_admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Snapshot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ------------------------------------------------------------------ runs
  /api/config-versions/:
    get:
      operationId: config_versions_list
      tags: [config]
      summary: Danh sách config version (engine, ngưỡng, model)
      x-labelx-trace: [FR-ENG-01]
      x-labelx-roles: [qa_lead, qc_admin, super_admin]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [draft, published] }
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Trang config version, mới nhất trước
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedConfigVersionList" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: config_versions_create
      tags: [config]
      summary: Tạo config version nháp
      description: Bản nháp sửa được; bản đã publish không sửa được (đổi cấu hình = tạo version mới).
      x-labelx-trace: [FR-ENG-01]
      x-labelx-roles: [qc_admin, super_admin]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigVersionCreate" }
      responses:
        "201":
          description: Config version nháp
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigVersion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/config-versions/{id}/publish/:
    post:
      operationId: config_versions_publish
      tags: [config]
      summary: Publish config version
