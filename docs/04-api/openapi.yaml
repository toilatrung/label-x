components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: labelx_sessionid
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }
    Cursor:
      name: cursor
      in: query
      description: Con trỏ trang từ trường next/previous (CursorPagination, PAGE_SIZE=50)
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        UUID do client sinh. Cùng key + cùng body → trả lại phản hồi cũ; cùng key + body khác →
        409 IDEMPOTENCY_KEY_REUSED (rest-api.html §3). Mức bắt buộc chờ Tech Lead xác nhận.
      schema: { type: string, format: uuid }
    GuidelineVersion:
      name: version
      in: query
      description: Guideline version tag; bỏ trống là bản mới nhất. Workspace truyền version của snapshot.
      schema: { type: string }

  responses:
    Gone:
      description: File Ground Truth đã được xóa sau lần chạy thành công; cần upload lại.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Vượt giới hạn tần suất theo người dùng (BUSINESS_RULE_UNMET; header Retry-After, details.retry_after_seconds)
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadGateway:
      description: Lỗi từ upstream dịch vụ (CVAT) hoặc điều kiện nghiệp vụ không đạt (BUSINESS_RULE_UNMET)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Dữ liệu không hợp lệ (VALIDATION_ERROR, INVALID_CREDENTIALS)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: |
        Chưa đăng nhập (NOT_AUTHENTICATED), không có quyền (FORBIDDEN), ngoài scope (OUT_OF_SCOPE),
        self-review (SELF_REVIEW_FORBIDDEN), tách nhiệm vụ (SAME_REQUESTER_APPROVER),
        thiếu identity mapping (IDENTITY_MAPPING_MISSING). Được ghi audit.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Không tìm thấy (NOT_FOUND)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: |
        Xung đột trạng thái (LEASE_CONFLICT, INVALID_TRANSITION, REVISION_UNCHANGED,
        IDEMPOTENCY_KEY_REUSED, SCOPE_BUSY, ISSUE_EXISTS). Được ghi audit.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unprocessable:
      description: Không đủ điều kiện nghiệp vụ (BUSINESS_RULE_UNMET, INSUFFICIENT_SAMPLE)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: Policy chưa được cấu hình (POLICY_NOT_CONFIGURED)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    WorkerConfig:
      type: object
      additionalProperties: false
      required: [revision, name, url, credential_ref, enabled, timeout_seconds]
      properties:
        revision: { type: integer, minimum: 0 }
        name: { type: string, minLength: 1, maxLength: 128 }
        url: { type: string, minLength: 1, maxLength: 255, description: HTTPS host trong Tailscale và exact allowlist của server. }
        credential_ref: { type: string, minLength: 1, maxLength: 64 }
        enabled: { type: boolean }
        timeout_seconds: { type: integer, minimum: 10, maximum: 1800 }
    WorkerEnvelope:
      type: object
      required: [config, credential_refs, allowed_hosts]
      properties:
        config:
          allOf: [{ $ref: "#/components/schemas/WorkerConfig" }]
          nullable: true
        credential_refs: { type: array, items: { type: string } }
        allowed_hosts: { type: array, items: { type: string } }
    WorkerProbeRequest:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision: { type: integer, minimum: 1 }
    WorkerModel:
      type: object
      required: [sha256, version, class_mapping_version, verified]
      properties:
        sha256: { type: string }
        version: { type: string }
        class_mapping_version: { type: string }
        verified: { type: boolean }
    WorkerProbe:
      type: object
      required: [revision, state, message, checked_at, latency_ms, device, model]
      properties:
        revision: { type: integer }
        state: { type: string, enum: [ready, unavailable, disabled] }
        message: { type: string }
        checked_at: { type: string, format: date-time }
        latency_ms: { type: integer, nullable: true }
        device: { type: string, nullable: true }
        model:
          allOf: [{ $ref: "#/components/schemas/WorkerModel" }]
          nullable: true
    GuidelineTaxonomyLabel:
      type: object
      properties:
        name:
          type: string
        required_attributes:
          type: array
          items:
            $ref: '#/components/schemas/GuidelineTaxonomyAttribute'
      required:
      - name
    GuidelineTaxonomyDefinition:
      type: object
      properties:
        version:
          type: string
        labels:
          type: array
          items:
            $ref: '#/components/schemas/GuidelineTaxonomyLabel'
      required:
      - labels
      - version
    GuidelineTaxonomyAttribute:
      type: object
      properties:
        name:
          type: string
        rule_id:
          type: string
        allowed_values:
          type: array
          items:
            type: string
      required:
      - name
      - rule_id
    GuidelinePreviewRule:
      type: object
      properties:
        rule_id:
          type: string
        section:
          type: string
      required:
      - rule_id
      - section
    GuidelinePreview:
      type: object
      properties:
        version:
          type: string
        name:
          type: string
        rules:
          type: array
          items:
            $ref: '#/components/schemas/GuidelinePreviewRule'
        taxonomy:
          allOf:
          - $ref: '#/components/schemas/GuidelineTaxonomyDefinition'
          nullable: true
      required:
      - name
      - rules
      - taxonomy
      - version
    GuidelineFile:
      type: object
      properties:
        content:
          type: string
          maxLength: 1000000
      required:
      - content
    SnapshotScope:
      type: object
      properties:
        cvat_task_ids:
          type: array
          items:
            type: integer
            minimum: 1
        cvat_job_ids:
          type: array
          items:
            type: integer
            minimum: 1
    DatasetGuidelineUpdate:
      type: object
      properties:
        guideline_version:
          type: string
          maxLength: 32
        expected_revision:
          type: integer
          minimum: 0
      required:
      - expected_revision
      - guideline_version
    DatasetGuideline:
      type: object
      properties:
        dataset_id:
          type: integer
        guideline_version:
          type: string
          nullable: true
        guideline_checksum:
          type: string
          nullable: true
        taxonomy_version:
          type: string
          nullable: true
        taxonomy_ready:
          type: boolean
        revision:
          type: integer
      required:
      - dataset_id
      - guideline_checksum
      - guideline_version
      - revision
      - taxonomy_ready
      - taxonomy_version
    GuidelineImportResult:
      type: object
      properties:
        version:
          type: string
        checksum:
          type: string
        taxonomy:
          $ref: '#/components/schemas/GuidelineTaxonomyDefinition'
        skipped:
          type: boolean
      required:
      - checksum
      - skipped
      - taxonomy
      - version
    GuidelineImport:
      type: object
      properties:
        content:
          type: string
          maxLength: 1000000
        taxonomy:
          $ref: '#/components/schemas/GuidelineTaxonomyDefinition'
      required:
      - content
    # ------------------------------------------------------------ lỗi chung
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - INVALID_CREDENTIALS
        - NOT_AUTHENTICATED
        - FORBIDDEN
        - OUT_OF_SCOPE
        - SELF_REVIEW_FORBIDDEN
        - SAME_REQUESTER_APPROVER
        - IDENTITY_MAPPING_MISSING
        - NOT_FOUND
        - LEASE_CONFLICT
        - INVALID_TRANSITION
        - REVISION_UNCHANGED
        - IDEMPOTENCY_KEY_REUSED
        - SCOPE_BUSY
        - ISSUE_EXISTS
        - BUSINESS_RULE_UNMET
        - INSUFFICIENT_SAMPLE
        - POLICY_NOT_CONFIGURED
        - POLICY_VERSION_MISMATCH
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
        message:
          type: string
          description: Thông báo tiếng Việt cho người dùng
        request_id:
          type: string
          description: Trùng header X-Request-ID của phản hồi; dùng để tra log và audit
        details:
          type: object
          additionalProperties: true
          description: |
            VALIDATION_ERROR: {"fields": {"<tên trường>": ["<lỗi>"]}}.
            INVALID_TRANSITION: {"from": "...", "event": "..."} và có thể drift_jobs.
            BUSINESS_RULE_UNMET ở frames_complete: {"undecided_issue_ids": [..]}.
            FORBIDDEN do thiếu hoặc sai CSRF (mọi request ghi, gồm auth_login/auth_logout): {"reason": "csrf"};
            client dùng khóa này để phân biệt với thiếu quyền và lấy lại labelx_csrftoken.
      example:
        code: LEASE_CONFLICT
        message: Lease đã hết hạn hoặc thuộc người khác
        request_id: 0b6f7c1e-3c55-4d43-9a43-3f0e1f6d2a10
        details: {}

    # ------------------------------------------------------------------ auth
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password, writeOnly: true }
    Role:
      type: string
      description: Vai trò theo SRS tab:rbac và đoạn dưới bảng (Product Owner, Data/Model Owner)
      enum: [annotator, reviewer, qa_lead, qc_admin, super_admin, product_owner, data_model_owner]
    RoleAssignment:
      type: object
      required: [role, dataset_id]
      properties:
        role: { $ref: "#/components/schemas/Role" }
        dataset_id:
          type: integer
          nullable: true
          description: null nghĩa là toàn hệ thống (chỉ super_admin, qc_admin)
    Session:
      type: object
      required: [user, roles, identity_mapping]
      properties:
        user:
          type: object
          required: [id, username, display_name]
          properties:
            id: { type: integer }
            username: { type: string }
            display_name: { type: string }
        roles:
          type: array
          items: { $ref: "#/components/schemas/RoleAssignment" }
        identity_mapping:
          type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [mapped, missing]
              description: missing → mọi thao tác review/phân xử/verify bị từ chối (fail closed)
            cvat_user_id: { type: integer, nullable: true }
    WorkflowPermissions:
      type: object
      required: [matrix, rules, user_roles]
      properties:
        matrix:
          type: array
          items: { $ref: "#/components/schemas/WorkflowMatrixItem" }
        rules:
          type: array
          items: { $ref: "#/components/schemas/WorkflowRule" }
        user_roles:
          type: array
          items: { $ref: "#/components/schemas/RoleAssignment" }
    WorkflowMatrixItem:
      type: object
      required: [function, roles]
      properties:
        function: { type: string }
        roles:
          type: object
          required: [annotator, reviewer, qa_lead, qc_admin, super_admin, product_owner, data_model_owner]
          properties:
            annotator: { type: string }
            reviewer: { type: string }
            qa_lead: { type: string }
            qc_admin: { type: string }
            super_admin: { type: string }
            product_owner: { type: string }
            data_model_owner: { type: string }
    WorkflowRule:
      type: object
      required: [rule, name, description, enforced]
      properties:
        rule: { type: string }
        name: { type: string }
        description: { type: string }
        enforced: { type: boolean }
        revision: { type: integer, description: Dùng làm expected_revision khi PATCH (MBE-05) }
        locked: { type: boolean, description: true thì không tắt được }

    # -------------------------------------------------------------- datasets
    Dataset:
      type: object
      required: [id, name, cvat_project_id]
      properties:
        id: { type: integer }
        name: { type: string }
        cvat_project_id: { type: integer }
        taxonomy_version: { type: string, nullable: true }
        guideline_version: { type: string, nullable: true }
    CvatTask:
      type: object
      required: [cvat_task_id, name, jobs]
      properties:
        cvat_task_id: { type: integer }
        name: { type: string }
        jobs:
          type: array
          items:
            type: object
            required: [cvat_job_id, assignee_cvat_user_id, updated_date]
            properties:
              cvat_job_id: { type: integer }
              assignee_cvat_user_id: { type: integer, nullable: true }
              assignee_name: { type: string, nullable: true }
              state: { type: string, nullable: true }
              cvat_url: { type: string, format: uri }
              frame_count: { type: integer }
              updated_date: { type: string, format: date-time }
              stage:
                type: string
                nullable: true
                enum: [annotation, validation, acceptance, null]
                description: Giai đoạn Job trong CVAT (đọc trực tiếp, không lưu vào Snapshot); vắng khi CVAT không trả.

    # ------------------------------------------------------------- snapshots
    SnapshotStatus:
      type: string
      description: docs/04-api/state-machines.html §1
      enum: [pending, exporting, locked, failed]
    SnapshotCreate:
      type: object
      properties:
        dataset_id:
          type: integer
          minimum: 1
        scope:
          $ref: '#/components/schemas/SnapshotScope'
        guideline_version:
          type: string
          maxLength: 32
        expected_guideline_version:
          type: string
          maxLength: 32
        note:
          type: string
          default: ''
          maxLength: 1000
      required:
      - dataset_id
      - scope
    SnapshotAccepted:
      type: object
      required: [id, status]
      properties:
        id: { type: integer }
        status: { $ref: "#/components/schemas/SnapshotStatus" }
        drift_jobs:
          type: array
          items: { type: integer }
    Snapshot:
      type: object
      required: [id, dataset_id, status, parent_snapshot_id, jobs, drift_jobs, created_by, created_at]
      properties:
        id: { type: integer }
        dataset_id: { type: integer }
        status: { $ref: "#/components/schemas/SnapshotStatus" }
        failure_reason:
          type: string
          nullable: true
          enum: [drift_detected, export_error, null]
        revision_hash:
          type: string
          nullable: true
          description: SHA-256 tổng, có khi locked (FR-SNP-03)
          example: "sha256:5f1d…"
        parent_snapshot_id: { type: integer, nullable: true }
        jobs:
          type: array
          items:
            type: object
            required: [cvat_job_id, cvat_task_id, job_hash, assignee_user_id, cvat_url, frames]
            properties:
              cvat_job_id: { type: integer }
              cvat_task_id: { type: integer }
              job_hash: { type: string, nullable: true }
              assignee_user_id:
                type: integer
                nullable: true
                description: LabelX user mapped from the CVAT assignee at export time.
              cvat_url: { type: string, format: uri }
              frames:
                type: array
                items: { $ref: "#/components/schemas/SnapshotFrame" }
        taxonomy_version: { type: string, nullable: true }
        guideline_version: { type: string, nullable: true }
        out_of_scope_shapes:
          type: integer
          description: Shape không phải bounding box bị bỏ qua (FR-SNP-07)
        drift_jobs:
          type: array
          items: { type: integer }
        created_by: { type: integer }
        created_at: { type: string, format: date-time }
        locked_at: { type: string, format: date-time, nullable: true }
    SnapshotFrame:
      type: object
      required: [frame_index, file_name, width, height, cvat_url]
      properties:
        id: { type: integer, description: ID SnapshotFrame dùng khi chọn frame tạo Benchmark; khác frame_index của CVAT. }
        frame_index: { type: integer, minimum: 0 }
        file_name: { type: string }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        cvat_url: { type: string, format: uri }
    PaginatedSnapshotList:
      type: object
      required: [results]
      properties:
        next: { type: string, nullable: true }
        previous: { type: string, nullable: true }
        results:
          type: array
          items: { $ref: "#/components/schemas/Snapshot" }

    # ------------------------------------------------------------------ runs
    RunStatus:
      type: string
      description: docs/04-api/state-machines.html §2
      enum: [queued, running, completed, partial, failed, cancelled]
    EngineName:
      type: string
      enum: [schema, geometry, duplicate, detector, metric, vlm]
    EngineStatus:
      type: string
      description: |
        Trạng thái công khai (FR-AGG-05); không giá trị nào nghĩa là "đạt".
        Suy ra từ LedgerEntry theo quy tắc trong docs/04-api/engine-interface.html §3 (T-006,
        DEC-010); `checked` chỉ khi mọi đơn vị eligible đã completed.
      enum: [running, checked, partial, failed, not_checked]
    NotCheckedReason:
      type: string
      description: SRS tab:enginestates
      enum: [disabled, no_model, no_reference, not_applicable, not_triggered]
    RunCreate:
      type: object
      required: [snapshot_id, config_version_id, seed]
      properties:
        snapshot_id: { type: integer }
        config_version_id: { type: integer }
        seed: { type: integer }
        metric_reference_id: { type: integer, minimum: 1, description: Reference của Ground Truth upload đã khóa; được gắn cố định với run. }
    RegisteredDetector:
      type: object
      required: [id, name, version, checksum, class_mapping_version, class_mapping]
      properties:
        id: { type: integer, readOnly: true }
        name: { type: string, readOnly: true }
        version: { type: string, readOnly: true }
        checksum: { type: string, readOnly: true }
        class_mapping_version: { type: string, readOnly: true }
        class_mapping:
          type: object
          additionalProperties: true
          readOnly: true
    ModelArtifact:
      type: object
      required: [name, version, checksum]
      properties:
        name: { type: string }
        version: { type: string }
        checksum: { type: string }
    EngineRunStatus:
      type: object
      required: [engine, status]
      properties:
        engine: { $ref: "#/components/schemas/EngineName" }
        status: { $ref: "#/components/schemas/EngineStatus" }
        reason:
          allOf: [{ $ref: "#/components/schemas/NotCheckedReason" }]
          nullable: true
        failed_units: { type: integer }
    Run:
      type: object
      required: [id, snapshot_id, config_version_id, seed, status, is_final, engines, created_by, created_at, origin_run_id, score_version, model_artifact, finished_at]
      properties:
        id: { type: integer }
        snapshot_id: { type: integer }
        config_version_id: { type: integer }
        seed: { type: integer }
        status: { $ref: "#/components/schemas/RunStatus" }
        is_final:
          type: boolean
          description: QC run cuối sau rework (FR-RWK-06) hoặc run gốc khi không có rework (BLOCKER-011)
        origin_run_id:
          type: integer
          nullable: true
          description: Run gốc mà run cuối này nối verification về (DEC-005)
        score_version: { type: string, nullable: true }
        model_artifact:
          allOf: [{ $ref: "#/components/schemas/ModelArtifact" }]
          nullable: true
        engines:
          type: array
          items: { $ref: "#/components/schemas/EngineRunStatus" }
        created_by: { type: integer }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
    RunShard:
      type: object
      required: [id, engine, shard_key, shard_index, status, attempt, last_error]
      properties:
        id: { type: integer }
        engine: { $ref: "#/components/schemas/EngineName" }
        shard_key: { type: string }
        shard_index: { type: integer }
        status: { type: string, enum: [pending, running, completed, failed, cancelled] }
        attempt: { type: integer }
        last_error: { type: string }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
    PaginatedRunShardList:
      type: object
      required: [results]
      properties:
        next: { type: string, nullable: true }
        previous: { type: string, nullable: true }
        results:
          type: array
          items: { $ref: "#/components/schemas/RunShard" }
    PaginatedCandidateList:
      type: object
      description: Danh sách candidate phân trang theo run
      required: [results, dedup_count]
      properties:
        next: { type: string, nullable: true }
        previous: { type: string, nullable: true }
        raw_count: { type: integer, nullable: true }
        dedup_count: { type: integer }
        results:
          type: array
          items: { $ref: "#/components/schemas/Candidate" }
    LedgerEntry:
      type: object
      description: |
        Coverage ledger của một engine trong một run (FR-AGG-04, T-006). Bất biến:
        total = completed + failed + pending + not_checked = eligible + excluded;
        excluded = not_checked_reasons.not_applicable + not_checked_reasons.not_triggered
        (đơn vị ngoài phạm vi áp dụng theo applicability_version; B-04 "mẫu số áp dụng", DEC-010);
        đơn vị failed, pending và not_checked do disabled/no_model/no_reference vẫn nằm trong eligible
        (không loại đơn vị lỗi khỏi mẫu số); coverage = completed / eligible, null khi eligible = 0.
        Khi excluded > 0, mọi nơi hiển thị coverage hoặc trạng thái engine phải hiện cảnh báo kèm số
        đơn vị bị loại theo lý do và applicability_version (engine-interface.html §4).
      required: [engine, status, unit, total, eligible, excluded, applicability_version, completed, failed, pending, not_checked, not_checked_reasons, coverage]
      x-labelx-trace:
        engine: [FR-AGG-04]
        status: [FR-AGG-05]
        required: [FR-GTE-01]
        unit: [FR-AGG-04]
        total: [FR-AGG-04]
        eligible: [FR-AGG-04, FR-RPT-04]
        excluded: [FR-AGG-04, FR-RPT-04]
        applicability_version: [FR-AGG-04]
        completed: [FR-AGG-04]
        failed: [FR-AGG-04]
        pending: [FR-AGG-04, FR-AGG-05]
        not_checked: [FR-AGG-04]
        not_checked_reasons: [FR-AGG-04, FR-ENG-09]
        coverage: [FR-AGG-04, FR-RPT-04, FR-GTE-01]
      properties:
        engine: { $ref: "#/components/schemas/EngineName" }
        status: { $ref: "#/components/schemas/EngineStatus" }
        required:
          type: boolean
          description: Engine bắt buộc cho coverage gate
        unit: { $ref: "#/components/schemas/EngineUnitKind" }
        total:
          type: integer
          minimum: 0
          description: Số đơn vị trong phạm vi snapshot của engine
        eligible:
          type: integer
          minimum: 0
          description: Mẫu số coverage; gồm cả đơn vị failed, pending và not_checked chặn (disabled, no_model, no_reference)
        excluded:
          type: integer
          minimum: 0
          description: Đơn vị ngoài phạm vi áp dụng (not_applicable + not_triggered), không vào mẫu số; > 0 thì phải hiện cảnh báo
        applicability_version:
          type: string
          description: Version quy tắc áp dụng đã dùng để loại đơn vị (EngineDescriptor.applicability_version)
        completed: { type: integer, minimum: 0 }
        failed:
          type: integer
          minimum: 0
          description: Đơn vị lỗi thực thi sau retry; vẫn trong mẫu số
        pending:
          type: integer
          minimum: 0
          description: Đơn vị chưa có kết quả (pending, running, retrying)
        not_checked: { type: integer, minimum: 0 }
        not_checked_reasons:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
          description: Số đơn vị theo NotCheckedReason; tổng bằng not_checked
        coverage:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
          description: completed / eligible; null khi eligible = 0
    # ------------------------------------------------ engine interface (T-006, DEC-010)
    # Hợp đồng giữa QC Orchestrator và mọi engine (NFR-13): engine nhận EngineInput theo shard,
    # trả EngineOutput; orchestrator ghi candidate, evidence, ledger trong một transaction
    # (FR-AGG-06). Giải thích: docs/04-api/engine-interface.html.
    EngineUnitKind:
      type: string
      description: Đơn vị áp dụng của engine (FR-AGG-04)
      enum: [frame, shape]
    EngineUnitOutcome:
      type: string
      description: |
        Trạng thái nội bộ của một đơn vị (không hiển thị). Map sang EngineStatus của đơn vị theo
        x-labelx-public-status, trùng kết quả tính từ ledger một đơn vị; trạng thái engine tổng hợp
        luôn tính từ LedgerEntry (engine-interface.html §3).
      enum: [pending, running, retrying, completed, failed, not_checked]
      x-labelx-trace: [FR-AGG-04, FR-AGG-05]
      x-labelx-public-status:
        pending: running
        running: running
        retrying: running
        completed: checked
        failed: failed
        not_checked: not_checked
    EngineInternalState:
      type: string
      description: |
        Trạng thái điều phối của engine trong run (orchestrator, không hiển thị). Không map trực
        tiếp sang EngineStatus: trạng thái hiển thị luôn tính từ LedgerEntry
        (engine-interface.html §3); x-labelx-terminal là các giá trị mà engine đã dừng.
      enum: [queued, running, retrying, succeeded, partially_succeeded, failed, cancelled, disabled, model_unavailable, reference_unavailable, not_applicable]
      x-labelx-trace: [FR-AGG-05, FR-ENG-09]
      x-labelx-terminal: [succeeded, partially_succeeded, failed, cancelled, disabled, model_unavailable, reference_unavailable, not_applicable]
    EngineDescriptor:
      type: object
      description: Đăng ký engine với orchestrator; thêm engine mới chỉ cần descriptor + worker (NFR-13)
      required: [name, version, unit, required, needs_model, needs_reference, applicability_version]
      x-labelx-trace:
        name: [NFR-13]
        version: [FR-ENG-01]
        unit: [FR-AGG-04]
        required: [FR-GTE-01]
        needs_model: [FR-ENG-05, FR-ENG-09]
        needs_reference: [FR-AGG-04]
        applicability_version: [FR-AGG-04]
      properties:
        name: { $ref: "#/components/schemas/EngineName" }
        version:
          type: string
          description: Version code engine, ghi vào run (FR-ENG-01)
        unit: { $ref: "#/components/schemas/EngineUnitKind" }
        required:
          type: boolean
          description: Engine bắt buộc cho coverage gate
        needs_model:
          type: boolean
          description: Thiếu model artifact thì engine Not checked (no_model)
        needs_reference:
          type: boolean
          description: Thiếu GT/reference thì engine Not checked (no_reference)
        applicability_version:
          type: string
          description: Version quy tắc chọn đơn vị áp dụng; đơn vị ngoài phạm vi ghi not_applicable
    EngineConfig:
      type: object
      description: Cấu hình engine có version, nằm trong config version của run
      required: [engine, version, enabled, params]
      x-labelx-trace:
        engine: [FR-ENG-01]
        version: [FR-ENG-01]
        enabled: [FR-AGG-04]
        params: [FR-ENG-07]
      properties:
        engine: { $ref: "#/components/schemas/EngineName" }
        version:
          type: string
          description: Version cấu hình (ngưỡng có version, FR-ENG-07)
        enabled:
          type: boolean
          description: false → mọi đơn vị not_checked với lý do disabled
        params:
          type: object
          additionalProperties: true
          description: Tham số riêng engine (ngưỡng IoU, τ_E1, τ_E2…)
    EngineUnitRef:
      type: object
