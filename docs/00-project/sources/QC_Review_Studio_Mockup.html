<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Interactive prototype của module Quality Control Review — Issue/Frame review, AI evidence panel, rework, adjudication, calibration, quality gate và release.">
<title>QC Review Studio</title>
<style>
:root{
  --bg:#f3f5f9;--panel:#ffffff;--panel-2:#f8fafc;--panel-3:#eef2f7;--line:#e1e6ee;--line-2:#cfd7e3;
  --text:#152033;--muted:#647089;--faint:#8a95aa;
  --brand:#3b5bdb;--brand-2:#2f4bc0;--brand-soft:#edf1ff;--brand-text:#2c48b8;
  --ok:#12805c;--ok-soft:#e6f6ee;--warn:#a5650a;--warn-soft:#fff3d9;--bad:#c0394b;--bad-soft:#ffecef;
  --info:#0f7493;--info-soft:#e4f4f9;--violet:#6e4fc0;--violet-soft:#f1ecff;--gray-soft:#eef1f5;
  --nav:#0f1a2e;--nav-2:#17243d;--nav-text:#c3cde2;--nav-muted:#7f8ba5;
  --shadow:0 1px 2px rgba(20,32,60,.05),0 6px 20px rgba(20,32,60,.06);
  --radius:12px;--topbar:56px;--ctxbar:42px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1320;--panel:#141c2c;--panel-2:#182234;--panel-3:#1d283c;--line:#26324a;--line-2:#33415e;
    --text:#e4e9f3;--muted:#9aa6bf;--faint:#7280a0;
    --brand:#6d8bff;--brand-2:#8aa2ff;--brand-soft:#1d2a52;--brand-text:#a9bbff;
    --ok:#3fc58f;--ok-soft:#143026;--warn:#e7a740;--warn-soft:#33270f;--bad:#f2697b;--bad-soft:#3a1820;
    --info:#4cc0de;--info-soft:#102e38;--violet:#a98cf5;--violet-soft:#2a2148;--gray-soft:#1f2a3e;
    --nav:#0a0f1a;--nav-2:#131c2e;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1320;--panel:#141c2c;--panel-2:#182234;--panel-3:#1d283c;--line:#26324a;--line-2:#33415e;
  --text:#e4e9f3;--muted:#9aa6bf;--faint:#7280a0;
  --brand:#6d8bff;--brand-2:#8aa2ff;--brand-soft:#1d2a52;--brand-text:#a9bbff;
  --ok:#3fc58f;--ok-soft:#143026;--warn:#e7a740;--warn-soft:#33270f;--bad:#f2697b;--bad-soft:#3a1820;
  --info:#4cc0de;--info-soft:#102e38;--violet:#a98cf5;--violet-soft:#2a2148;--gray-soft:#1f2a3e;
  --nav:#0a0f1a;--nav-2:#131c2e;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:13.5px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
a{color:var(--brand-text);text-decoration:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{margin:0;line-height:1.25}
code,.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}
[hidden]{display:none!important}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;overflow:auto;background:var(--nav);color:var(--nav-text);padding:14px 10px 18px;display:flex;flex-direction:column;gap:2px;z-index:30}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;margin-bottom:6px;border-bottom:1px solid #22304b}
.logo-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#4c6ef5,#7950f2);display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;letter-spacing:.02em}
.logo b{display:block;color:#fff;font-size:14px}
.logo small{color:var(--nav-muted);font-size:11px}
.nav-group{margin-top:10px}
.nav-label{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--nav-muted);padding:6px 10px 4px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;color:var(--nav-text);padding:7px 10px;border-radius:8px;text-align:left;font-size:13px}
.nav-item:hover{background:var(--nav-2);color:#fff}
.nav-item.active{background:#24345a;color:#fff;box-shadow:inset 3px 0 0 #748ffc}
.nav-item .ico{width:18px;white-space:nowrap;flex:none;font-size:12px;text-align:center;opacity:.85;font-size:13px}
.nav-item .cnt{margin-left:auto;background:#22314f;color:#c9d4ec;border-radius:20px;padding:0 7px;font-size:11px;font-weight:700}
.nav-sub{padding-left:27px;font-size:12.5px}
.side-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid #22304b;font-size:11px;color:var(--nav-muted)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;height:var(--topbar);display:flex;align-items:center;gap:12px;padding:0 18px;background:var(--panel);border-bottom:1px solid var(--line)}
.topbar .menu-btn{display:none}
.grid > *,.kpis > *{min-width:0}
.pane-b > .decision-bar{position:sticky;bottom:0;z-index:2}
.crumbs{display:flex;align-items:center;gap:6px;min-width:0;flex:1;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden}
.crumbs a{color:var(--muted)}
.crumbs a:hover{color:var(--text)}
.crumbs .sep{color:var(--faint)}
.crumbs .cur{color:var(--text);font-weight:650;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;align-items:center;gap:8px}
.role-select{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;padding:3px 4px 3px 9px;background:var(--panel-2)}
.role-select label{font-size:11px;color:var(--muted)}
.role-select select{border:0;background:transparent;font-weight:650;padding:4px 2px;max-width:150px}
.ctx-btn{cursor:pointer;font:inherit;color:inherit}
.ctx-btn:hover{border-color:var(--brand);background:var(--brand-soft)}
.ctx-btn i{font-style:normal;color:var(--muted);font-size:10px}
.ctx-btn.scoped{border-color:var(--info);background:var(--info-soft)}
.dot.st-CHECKED{color:var(--ok)}.dot.st-PARTIAL{color:var(--warn)}.dot.st-FAILED{color:var(--bad)}.dot.st-NOT_CHECKED{color:var(--faint)}
.ctx-pop{position:fixed;z-index:80;background:var(--panel);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 18px 50px rgba(15,25,50,.22);padding:6px;max-height:min(70vh,520px);overflow:auto}
.pop-h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:750;padding:6px 8px}
.pop-row{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:7px 8px;border-radius:8px;color:var(--text)}
.pop-row:hover:not(:disabled){background:var(--panel-3)}
.pop-row.on{background:var(--brand-soft)}
.pop-row:disabled{opacity:.45}
.pop-row .pr-main{flex:1;min-width:0}
.pop-row .pr-main b{font-size:13px}
.pop-row small{display:block;color:var(--muted);font-size:11.5px}
.pop-row.tree.l1{padding-left:18px}.pop-row.tree.l2{padding-left:36px}
.pop-row .radio{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-2);flex:none}
.pop-row.on .radio{border-color:var(--brand);box-shadow:inset 0 0 0 3px var(--panel);background:var(--brand)}
.pop-foot{display:block;padding:8px;border-top:1px solid var(--line);margin-top:4px;font-size:12.5px}
.scope-tag{margin:-4px 0 12px}
td b.mono{white-space:nowrap}
@media (max-width:1599px){.ctx-note{display:none}}
.role-sum{font-size:11.5px;color:var(--nav-muted);padding:0 10px 8px;line-height:1.4}
.role-sum b{color:#fff}
.scope-tree{border:1px solid var(--line);border-radius:9px;padding:6px 10px;max-height:240px;overflow:auto;background:var(--panel-2)}
.st-task,.st-job{display:flex;gap:6px;align-items:baseline;padding:3px 0;font-size:12.5px;flex-wrap:wrap}
.st-job{padding-left:22px}
tr.grp-row td{background:var(--panel-3);font-weight:700;font-size:12px}
table.tj tr.task-row td{background:var(--panel-2);font-weight:600}
.tip{position:fixed;z-index:120;max-width:320px;background:#16213a;color:#e8eefb;border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.45;box-shadow:0 14px 40px rgba(0,0,0,.3);pointer-events:none;border:1px solid #2c3b5c}
.tip p{margin:4px 0 6px}
.tip .tip-t{font-size:13px;color:#fff}
.tip .tip-r{font-size:12px;margin-top:2px}
.tip .tip-r span{color:#9fb2d8;font-weight:650}
.tip kbd.k{background:#24314d;border-color:#3a4a6b;color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tip{background:#e8edf7;color:#17223a;border-color:#c5d0e4}:root:not([data-theme="light"]) .tip .tip-t{color:#0e1830}:root:not([data-theme="light"]) .tip .tip-r span{color:#4a5c80}}
.avatar.sa{background:linear-gradient(135deg,#f08c00,#e8590c);color:#fff}
.sa-banner{font-size:11.5px;font-weight:700;color:#fff;background:linear-gradient(135deg,#e8590c,#c2255c);border-radius:20px;padding:4px 11px;white-space:nowrap}
.nav-item.locked{opacity:.48}
.nav-item.locked:hover{opacity:.75}
.nav-item .lbl{min-width:0;flex:1}
.nav-item .lock{margin-left:auto;font-size:10px}
button.nav-label{text-align:left;display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:transparent;cursor:pointer}
button.nav-label:hover{color:#c9d4ec}
.tab.locked{opacity:.5}
.sec-title{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:750;margin:20px 0 10px}
.ov-sec:first-of-type .sec-title{margin-top:4px}
.kpis.k6{grid-template-columns:repeat(6,minmax(0,1fr))}
.kpis.k5{grid-template-columns:repeat(5,minmax(0,1fr))}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi.flat{box-shadow:none;background:var(--panel-2)}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--panel-3)}
.stack i{display:block;height:100%}
.qrow{padding:8px 0;border-bottom:1px solid var(--line);color:inherit}
.seg-sm button{padding:4px 10px;font-size:12px}
.engdots{display:flex;gap:3px}
.ed{width:12px;height:12px;border-radius:3px;background:var(--line-2)}
.ed.CHECKED{background:var(--ok)}.ed.ISSUE_FOUND{background:var(--brand)}.ed.PARTIAL{background:var(--warn)}.ed.FAILED{background:var(--bad)}
a.step{color:inherit;text-decoration:none}
table.cm th,table.cm td{padding:6px 8px}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-text);font-weight:800;font-size:11px;border:0}
.ctxbar{position:sticky;top:var(--topbar);z-index:19;min-height:var(--ctxbar);display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 18px;background:var(--panel-2);border-bottom:1px solid var(--line);font-size:12px}
.ctx{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border:1px solid var(--line);border-radius:7px;background:var(--panel);white-space:nowrap}
.ctx span{color:var(--muted)}
.ctx b{font-weight:650}
.ctx.lock::after{content:"🔒";font-size:10px;margin-left:2px}
.ctx-note{margin-left:auto;color:var(--muted);font-size:11px;white-space:nowrap}
.content{padding:18px;min-width:0;flex:1}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.page-head h1{font-size:20px;font-weight:750;letter-spacing:-.01em}
.page-head p{margin:4px 0 0;color:var(--muted);max-width:760px}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:var(--panel);color:var(--text);padding:6px 12px;border-radius:8px;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--panel-3)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--brand-2)}
.btn.sm{padding:3px 9px;font-size:12px;border-radius:7px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover:not(:disabled){background:var(--panel-3)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.card-h h2,.card-h h3{font-size:14px;font-weight:700}
.card-h .sub{color:var(--muted);font-size:12px}
.card-b{padding:14px}
.card-b.tight{padding:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow)}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:23px;font-weight:750;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:11.5px;color:var(--muted);margin-top:2px}
.kpi.warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.kpi.bad{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;background:var(--gray-soft);color:var(--muted);line-height:1.6}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-bad{background:var(--bad-soft);color:var(--bad)}
.b-info{background:var(--info-soft);color:var(--info)}
.b-brand{background:var(--brand-soft);color:var(--brand-text)}
.b-violet{background:var(--violet-soft);color:var(--violet)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:currentColor}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;background:var(--panel-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--panel-2)}
tbody tr.sel{background:var(--brand-soft)}
.tbl-wrap{overflow:auto}
.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}
.note{font-size:12px;color:var(--muted);padding:8px 12px;border-top:1px dashed var(--line)}
.callout{padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);font-size:12.5px}
.callout.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent);color:var(--text)}
.callout.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.callout.info{background:var(--info-soft);border-color:color-mix(in srgb,var(--info) 30%,transparent)}
.callout.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tab{border:0;background:transparent;padding:9px 12px;border-bottom:2px solid transparent;color:var(--muted);font-weight:650;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tab:hover{color:var(--text)}
.tab.active{color:var(--brand-text);border-bottom-color:var(--brand)}
.tab .cnt{background:var(--panel-3);border-radius:20px;padding:0 7px;font-size:11px;color:var(--muted)}
.tab.active .cnt{background:var(--brand-soft);color:var(--brand-text)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.filters select,.filters input,.field input,.field select,.field textarea{border:1px solid var(--line-2);background:var(--panel);border-radius:7px;padding:5px 8px;min-width:0}
.filters input[type=search]{min-width:200px;flex:1}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:12px;font-weight:650;color:var(--muted)}
.field textarea{min-height:64px;resize:vertical}
.field .req{color:var(--bad)}
.field.err input,.field.err select,.field.err textarea{border-color:var(--bad)}
.field .errmsg{font-size:11.5px;color:var(--bad)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:5px 12px;font-size:12.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:550;min-width:0;overflow-wrap:anywhere}
.progress{height:7px;border-radius:9px;background:var(--panel-3);overflow:hidden;min-width:60px}
.progress > i{display:block;height:100%;background:var(--brand);border-radius:9px;transition:width .25s}
.progress.ok > i{background:var(--ok)}
.progress.warn > i{background:var(--warn)}
.progress.bad > i{background:var(--bad)}
.list{list-style:none;margin:0;padding:0}
.list li{padding:9px 12px;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
pre.json{margin:0;background:#0f1828;color:#dbe6ff;padding:12px;border-radius:9px;overflow:auto;font:11.5px/1.55 ui-monospace,Consolas,monospace;max-height:420px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line-2);border-radius:20px;padding:2px 9px;font-size:12px;background:var(--panel)}
.check{display:inline-flex;gap:6px;align-items:center;font-size:12.5px}
.stepper{display:flex;gap:0;margin-bottom:14px;overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.step{flex:1 1 0;min-width:130px;border:0;background:transparent;padding:10px 12px;text-align:left;border-right:1px solid var(--line);display:flex;gap:9px;align-items:center}
.step:last-child{border-right:0}
.step .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;background:var(--panel-3);color:var(--muted);flex:none}
.step b{display:block;font-size:12.5px}
.step small{color:var(--muted);font-size:11px}
.step.done .n{background:var(--ok-soft);color:var(--ok)}
.step.active{background:var(--brand-soft)}
.step.active .n{background:var(--brand);color:#fff}
.gate{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-bottom:1px solid var(--line)}
.gate:last-child{border-bottom:0}
.gate .gi{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.gate .gt{flex:1;min-width:0}
.gate .gt b{display:block}
.gate .gt span{font-size:12px;color:var(--muted)}
.status-banner{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--radius);margin-bottom:14px;border:1px solid;flex-wrap:wrap}
.status-banner.blocked{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.status-banner.ready{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.status-banner.released{background:var(--brand-soft);border-color:color-mix(in srgb,var(--brand) 35%,transparent)}
.status-banner h2{font-size:15px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.svgchart{width:100%;height:auto;display:block}
.svgchart text{fill:var(--muted);font-size:11px;font-family:inherit}
.svgchart .lbl{fill:var(--text);font-size:11.5px}
.noaccess{max-width:560px;margin:60px auto;text-align:center}
.noaccess .ic{font-size:34px}

/* ---------- workspace ---------- */
.ws-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:6px 12px;font-weight:650;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--brand);color:#fff}
.ws{--wd:330px;--wa:350px;display:grid;grid-template-columns:minmax(0,1fr) 6px var(--wd) 6px var(--wa);height:calc(100vh - var(--topbar) - var(--ctxbar) - 36px - 48px);min-height:560px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--panel);box-shadow:var(--shadow)}
.ws.cd{--wd:40px}
.ws.ca{--wa:40px}
.pane{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--panel)}
.pane-h{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);min-height:42px}
.pane-h h3{font-size:13px;font-weight:700;white-space:nowrap}
.pane-b{flex:1;overflow:auto;min-height:0}
.splitter{background:var(--line);cursor:col-resize;position:relative}
.splitter:hover,.splitter.drag{background:var(--brand)}
.collapsed-label{writing-mode:vertical-rl;transform:rotate(180deg);padding:12px 0;color:var(--muted);font-weight:700;font-size:12px;border:0;background:transparent;height:100%;width:100%}
.canvas-pane{background:#0b1220}
.canvas-tools{display:flex;gap:6px;align-items:center;padding:7px 10px;background:#111a2b;color:#c9d3e6;border-bottom:1px solid #1f2b42;flex-wrap:wrap}
.canvas-tools .btn{background:#1a2538;border-color:#2a3956;color:#dbe3f3}

.canvas-tools .btn.on{background:#2f4bc0;border-color:#3b5bdb;color:#fff}
.canvas-tools .lbl{font-size:11px;color:#8d9ab5;margin-left:4px}
.ovl{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#c9d3e6;padding:2px 6px;border-radius:6px;cursor:pointer;user-select:none}
.ovl input{accent-color:#748ffc}
.ovl i{width:12px;height:3px;border-radius:2px;display:inline-block}
.canvas-host{flex:1;min-height:0;position:relative;overflow:hidden;cursor:grab;touch-action:none}
.canvas-host.panning{cursor:grabbing}
.canvas-host svg{width:100%;height:100%;display:block}
.canvas-foot{display:flex;gap:10px;align-items:center;padding:6px 10px;background:#111a2b;color:#8d9ab5;font-size:11.5px;border-top:1px solid #1f2b42;flex-wrap:wrap}
.canvas-foot b{color:#dbe3f3}
.canvas-foot .btn{background:#1a2538;border-color:#2a3956;color:#dbe3f3}
.ann-box{cursor:pointer}
.sec{padding:12px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h4{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp > div{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--panel-2)}
.cmp small{display:block;color:var(--muted);font-size:11px}
.cmp b{font-size:14px}
.cmp .cand{border-style:dashed;border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.decision-bar{border-top:1px solid var(--line);padding:10px;background:var(--panel-2)}
.dec-btns{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.dec{border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:6px 4px;font-weight:700;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:1px}
.dec kbd{font-size:10px;color:var(--faint);font-family:inherit;font-weight:600}
.dec:hover:not(:disabled){background:var(--panel-3)}
.dec.on{outline:2px solid var(--brand);outline-offset:-1px;background:var(--brand-soft)}
.dec.d-confirm{color:var(--bad)}.dec.d-reject{color:var(--ok)}.dec.d-uncertain{color:var(--warn)}.dec.d-rework{color:var(--violet)}.dec.d-escalate{color:var(--info)}
.dec-form{margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}

.nav-row .btn{flex:1}
.ai-tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}

.ai-tabs button.on{color:var(--brand-text);border-bottom-color:var(--brand)}
.ai-banner{margin:10px 12px 0;padding:7px 10px;border-radius:8px;background:var(--info-soft);color:var(--text);font-size:11.5px;border:1px solid color-mix(in srgb,var(--info) 25%,transparent)}
.ev{border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:8px;background:var(--panel-2)}
.ev-h{display:flex;justify-content:space-between;gap:6px;align-items:center;margin-bottom:4px}
.ev-h b{font-size:12.5px}
.ev p{margin:0;font-size:12.5px}
.ev .meta{font-size:11px;color:var(--muted);margin-top:4px}
.cite{border-left:3px solid var(--brand);padding:6px 10px;background:var(--brand-soft);border-radius:0 8px 8px 0;font-size:12.5px;margin:6px 0}
.crop{width:100%;border-radius:8px;border:1px solid var(--line);background:#0b1220;display:block}
.sig{display:flex;gap:7px;font-size:12.5px;padding:4px 0}

.drift{margin:10px 10px 0;padding:9px 11px;border-radius:9px;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);font-size:12.5px}

.hist div{margin-bottom:6px}
.ai-fab{display:none}

.toast-wrap{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:100;max-width:min(380px,calc(100vw - 36px))}

dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--panel);color:var(--text);width:min(560px,calc(100vw - 32px));box-shadow:0 20px 60px rgba(0,0,0,.3)}

.dlg-b{padding:16px;max-height:70vh;overflow:auto}

.tour .pg{font-size:11px;color:var(--faint)}
.proto-note{font-size:11px;color:var(--muted);border:1px dashed var(--line-2);border-radius:20px;padding:3px 10px;white-space:nowrap}

@media (max-width:1279px){
  .ws{grid-template-columns:minmax(0,1fr) 6px var(--wd)}

  .sa-banner{display:none}
  .ctx-note{display:none}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .proto-note{display:none}
}
@media (max-width:980px){
  .app{grid-template-columns:1fr}

  .topbar .menu-btn{display:inline-flex}
  .g2,.g-main{grid-template-columns:1fr}
}
@media (max-width:640px){
  :root{--topbar:52px}

  .topbar{padding:0 10px;gap:8px}
  .crumbs{font-size:12px}
  .crumbs .hide-sm{display:none}
  .role-select label{display:none}
  .role-select select{max-width:100px}
  #demoBtn{display:none}
  .ctxbar{position:static;padding:6px 10px;flex-wrap:nowrap;overflow-x:auto}
  .ctx-note{display:none}
  .kpis,.kpis.k4,.kpis.k5,.kpis.k6,.kpis.k3,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .seg-sm{flex-wrap:wrap}
  .ws{display:flex;flex-direction:column;height:auto;min-height:0}
  .ws > .splitter{display:none}
  .ws .canvas-pane{height:300px;flex:none}
  .ws > .ai-pane{position:static;transform:none;width:auto;box-shadow:none;border-left:0;border-top:1px solid var(--line)}
  .ws.cd > .detail-pane .pane-b,.ws.cd > .detail-pane .decision-bar{display:block}
  .ai-fab,.ai-close{display:none!important}
  .ai-pane .pane-b{max-height:none}
  .dec-btns{grid-template-columns:repeat(3,minmax(0,1fr))}
  .page-head h1{font-size:18px}
  .filters input[type=search]{min-width:0;width:100%}
  th,td{padding:7px 9px}
  .hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

  const crit = runIssues().filter(isOpenCritical);
  const rw = runIssues().filter(i => i.status === 'rework' || i.status === 'verify' || i.status === 'confirmed');
  const g = [
    { key: 'coverage', name: 'QC coverage', ok: S.coverage >= S.coverageTarget, detail: `Coverage ${S.coverage}% / ngưỡng ${S.coverageTarget}% · VLM ${S.engines.find(e => e.key === 'vlm').status}, Metric ${S.engines.find(e => e.key === 'metric').status}`, action: 'Chạy bổ sung engine PARTIAL/FAILED ở QC Analysis hoặc yêu cầu waiver', waivable: true },
    { key: 'critical', name: 'Critical issues', ok: crit.length === 0, detail: crit.length ? `${crit.length} critical chưa đóng: ${crit.map(i => i.id).join(', ')}` : 'Không còn critical defect chưa xử lý', action: 'Review / adjudicate / rework rồi verify', waivable: false },
    { key: 'rework', name: 'Rework', ok: rw.length === 0, detail: rw.length ? `${rw.length} request chưa verify: ${rw.map(i => i.id).join(', ')}` : 'Mọi rework request đã verify', action: 'Annotator sửa → reviewer verify', waivable: false },
    { key: 'audit', name: 'Benchmark & Audit', ok: auditReviewed() >= S.audit.size, detail: `Random audit ${auditReviewed()}/${S.audit.size} frame đã Mark Reviewed · Benchmark v0.9: class scooter Not evaluable`, action: 'Hoàn tất audit frame còn lại (Review Center → Random Audit)', waivable: true },
    { key: 'integrity', name: 'Version integrity', ok: true, detail: `Snapshot ${CTX.snapshot} · rev ${CTX.rev} · taxonomy ${CTX.taxonomy} · guideline ${CTX.guideline} · ${S.cfg.version === 'cfg-v7' ? 'cfg-v7' : 'cfg-v7 (run) · ' + S.cfg.version + ' (mới, chưa dùng)'}`, action: '', waivable: false }
  ];
  g.forEach(x => { x.waived = !x.ok && !!waived(x.key); x.state = x.ok ? 'pass' : x.waived ? 'waived' : 'fail'; });
  const allOk = g.every(x => x.state !== 'fail');
  g.push({ key: 'approval', name: 'Authorized approval', ok: !!S.released, state: S.released ? 'pass' : allOk ? 'pending' : 'blocked', detail: S.released ? `Approved by ${S.released.by} · ${S.released.at}` : allOk ? 'Sẵn sàng — chờ QA Lead phê duyệt' : 'Chờ các gate phía trên đạt hoặc có waiver hợp lệ', action: '' });

}

function auditManifest() {

  const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
  const special = [436, 1491, 509, 333]; const used = new Set(special);
  while (out.length < 46) { const f = 1 + Math.floor(rnd() * 12500); if (used.has(f)) continue; used.add(f); out.push(f); }
  const all = [...out, ...special].sort((a, b) => a - b);
  S._manifest = all.map((f, k) => ({ frame: f, cam: cams[f % 5], result: f === 1491 ? 'Defect (QC-00142)' : f === 2207 || k === 17 ? 'Defect · Minor' : 'No defect' }));
  return S._manifest;
}

function saveDecision() {
  const ws = S.ws; const i = issueById(ws.issueId); const f = ws.form; const d = ws.dec; const e = {};
  const need = { confirm: ['defect', 'severity', 'rationale'], reject: ['reason'], uncertain: ['question'], rework: ['instruction', 'severity'], escalate: ['to', 'reason'] }[d];
  if (S.role === 'super') need.push('override');
  need.forEach(k => { if (!f[k] || !String(f[k]).trim()) e[k] = 'Bắt buộc'; });
  ws.errors = e; if (Object.keys(e).length) { render(); const first = $('.field.err [data-f]'); if (first) first.focus(); toast('Thiếu thông tin bắt buộc cho quyết định.', 'warn'); return; }
  ws.saving = true; render();

    if (d === 'reject') { to = 'rejected'; note = f.reason + (f.note ? ' — ' + f.note : ''); i.resolution = 'Reject · ' + note; }
    if (d === 'uncertain') { to = 'uncertain'; i.question = f.question; i.decidedBy = ME().name; note = f.question; }
    if (d === 'rework') { to = 'rework'; i.instruction = f.instruction; i.severity = f.severity; note = f.instruction; }
    if (d === 'escalate') { to = 'escalated'; i.question = f.reason; i.decidedBy = ME().name; note = '→ ' + f.to + ': ' + f.reason; }
    i.status = to; i.lease = null;
    S.log.push({ issueId: i.id, actor: ME().name, role: ME().role, action: DECISIONS.find(x => x[0] === d)[1], from, to, note, override: S.role === 'super' ? f.override : undefined, ts: nowStr(), rev: ws.driftChoice[i.id] === 'latest' ? 'e04b77' : i.rev });
    ws.saving = false; ws.dec = null; ws.form = {}; ws.errors = {}; ws.justSaved = i.id;

document.addEventListener('touchstart', e => { const el = e.target.closest('[data-help]'); hideTip(); if (el) lpTimer = setTimeout(() => showTip(el), 500); }, { passive: true });

VIEWS.rework = () => {
  const ann = S.role === 'annotator';
  const list = scoped().filter(i => (i.status === 'rework' || i.status === 'verify') && (!ann || i.annotator === ME().name));
  const rows = list.map(i => `<tr><td><b class="mono">${i.id}</b><div class="small muted">round ${i.reworkRound + 1}</div></td><td class="mono">${pad5(i.frame)} · ${i.obj ? '#' + i.obj : '—'}<div class="small muted">${i.task} · Job ${i.job}</div></td><td>${esc(i.confirmedType || i.type)} ${sevBadge(i.severity)}<div class="small muted">${TYPE_RULE[i.type].rule} ${TYPE_RULE[i.type].section}</div></td><td class="small" style="max-width:300px">${esc(i.instruction || '—')}</td><td class="mono small">${i.rev}${i.status === 'verify' ? ' → b27d10' : ''}</td><td>${stBadge(i.status)}</td>
    <td><div class="row" style="flex-wrap:nowrap">${i.status === 'rework' ? `<button class="btn sm" data-act="cvat" data-id="${i.id}" data-help="act:cvat">Open in CVAT ↗</button>${CAN.doRework(S.role) ? `<button class="btn sm primary" data-act="rw-submit" data-id="${i.id}" data-help="act:rw-submit">Submit for verification</button>` : '<span class="small muted">Chờ annotator</span>'}` : CAN.verifyRework(S.role) ? `<button class="btn sm ok" data-act="rw-pass" data-id="${i.id}" data-help="act:rw-pass">✓ Pass</button><button class="btn sm danger" data-act="rw-fail" data-id="${i.id}" data-help="act:rw-fail">✕ Fail</button>` : '<span class="small muted">Chờ reviewer verify</span>'}</div></td></tr>`).join('');
  return `<div class="page-head"><div><h1>Rework Tracking</h1><p>${ann ? 'Việc sửa được giao cho bạn. Mỗi request có issue, vị trí, rule và revision gốc.' : 'Theo dõi rework request và verify revision mới. Pass → Closed; Fail → trả về annotator.'}</p></div></div>${scopeTag()}
  <div class="kpis k4"><div class="kpi"><div class="l">Cần sửa</div><div class="v">${list.filter(i => i.status === 'rework').length}</div></div><div class="kpi"><div class="l">Chờ verify</div><div class="v">${list.filter(i => i.status === 'verify').length}</div></div><div class="kpi"><div class="l">Closed hôm nay</div><div class="v">${4 + S.log.filter(l => l.action === 'Verify pass').length}</div></div><div class="kpi"><div class="l">Fail verify (vòng 2+)</div><div class="v">${S.issues.filter(i => i.reworkRound > 0).length}</div></div></div>
  <div class="card"><div class="card-h"><h2>Rework requests</h2><span class="sub">Annotation flow: CVAT → revision mới → verify · snapshot ${CTX.snapshot} giữ nguyên</span></div><div class="tbl-wrap"><table><thead><tr><th>Issue</th><th>Frame · Object</th><th>Defect · rule</th><th>Hướng dẫn</th><th>Revision</th><th>Status</th><th>Hành động</th></tr></thead><tbody>${rows || '<tr><td colspan="7" class="empty">Không có rework request đang mở. 🎉</td></tr>'}</tbody></table></div>
  <div class="note">Khi verify, các QC check bị ảnh hưởng (geometry, schema, duplicate trên object) được chạy lại trên revision mới.</div></div>`;
};

      toast(`Frame ${pad5(ws.frame)} đã lưu audit record. Random audit: ${auditReviewed()}/${S.audit.size}.`, 'ok'); render(); break;
    }
    case 'rw-submit': { const i = issueById(id); i.status = 'verify'; i.rev = 'b27d10'; S.log.push({ issueId: id, actor: ME().name, role: ME().role, action: 'Submit for verification', from: 'rework', to: 'verify', note: 'rev mới', ts: nowStr() }); toast(`${id} đã gửi verify. Revision mới được tạo; snapshot ${CTX.snapshot} giữ nguyên.`, 'ok'); render(); break; }
    case 'rw-pass': { const i = issueById(id); i.status = 'closed'; i.fixed = true; i.resolution = 'Rework verified · QC checks chạy lại: pass'; S.log.push({ issueId: id, actor: ME().name, role: ME().role, action: 'Verify pass', from: 'verify', to: 'closed', note: '', ts: nowStr() }); toast(`${id} → Closed.`, 'ok'); render(); break; }
    case 'rw-fail': { const i = issueById(id); i.status = 'rework'; i.reworkRound++; S.log.push({ issueId: id, actor: ME().name, role: ME().role, action: 'Verify fail', from: 'verify', to: 'rework', note: 'trả về annotator', ts: nowStr() }); toast(`${id} trả lại annotator (vòng ${i.reworkRound + 1}).`, 'warn'); render(); break; }
    case 'adj-sel': S.adj.sel = id; render(); break;
    case 'adj-confirm': case 'adj-reject': { const ov = S.role === 'super' ? ($('#adj-override')?.value || '').trim() : ''; if (S.role === 'super' && !ov) { $('#adj-override').closest('.field').classList.add('err'); toast('Super Admin phải nhập lý do override.', 'warn'); return; } const i = issueById(id); const from = i.status; i.status = act === 'adj-confirm' ? 'rework' : 'rejected'; if (act === 'adj-confirm') i.instruction = `Thêm/sửa ${i.proposal} theo ${TYPE_RULE[i.type].rule} (QA adjudication).`; else i.resolution = 'Rejected bởi QA adjudication'; S.log.push({ issueId: id, actor: ME().name, role: ME().role, action: act === 'adj-confirm' ? 'Adjudicate: confirm' : 'Adjudicate: reject', from, to: i.status, note: TYPE_RULE[i.type].rule, override: ov || undefined, ts: nowStr() }); toast(`${id} đã phân xử → ${STATUS_LABEL[i.status]}. Case lưu vào Decision Cases.`, 'ok'); render(); break; }
    case 'adj-gap': gapDialog(id); break;
    case 'gg-save': { const desc = $('#gg-desc').value.trim(), prop = $('#gg-prop').value.trim(); if (!desc || !prop) { [['#gg-desc', desc], ['#gg-prop', prop]].forEach(([s, v]) => { if (!v) $(s).closest('.field').classList.add('err'); }); return; } const gid = 'GG-' + String(7 + S.gaps.length).padStart(3, '0'); S.gaps.push({ id: gid, rule: $('#gg-rule').value, title: desc, status: 'Open', cases: [$('#gg-case').value], impact: 'Đang phân tích', by: ME().name }); closeDialog(); toast(`Đã tạo ${gid}. Xem ở tab Guideline Gaps.`, 'ok'); render(); break; }
    case 'gap-propose': S.gaps.find(g => g.id === id).status = 'Proposed'; render(); break;
    case 'gap-approve': { const g = S.gaps.find(x => x.id === id); g.status = 'Approved v1.3'; g.impact = g.impact.startsWith('Chưa') || g.impact.startsWith('Đang') ? '2 job · 1 class · ~18 object' : g.impact; toast(`${id} approved vào guideline v1.3-draft. Run hiện tại vẫn tham chiếu ${CTX.guideline}.`, 'ok'); render(); break; }
    case 'gap-reject': S.gaps.find(g => g.id === id).status = 'Rejected'; render(); break;
    case 'gap-rework': toast(`Tạo targeted rework cho phạm vi của ${id}: ${esc(S.gaps.find(g => g.id === id).impact)} (mô phỏng).`, 'ok'); break;
    case 'waiver': { const gate = $('#wv-gate').value, owner = $('#wv-owner').value.trim(), reason = $('#wv-reason').value.trim(), exp = $('#wv-exp').value; if (!gate) return toast('Không có gate cần waiver.', 'warn'); if (!owner || !reason || !exp) { if (!reason) $('#wv-reason').closest('.field').classList.add('err'); return toast('Waiver cần người chịu trách nhiệm, lý do và hạn.', 'warn'); } const ov = S.role === 'super' ? $('#wv-override').value.trim() : ''; if (S.role === 'super' && !ov) { $('#wv-override').closest('.field').classList.add('err'); return toast('Super Admin phải nhập lý do override.', 'warn'); } S.waivers.push({ gate, owner, reason, expires: exp, at: nowStr(), requestedBy: ME().name, role: ME().role, override: ov || undefined }); S.log.push({ issueId: '—', actor: ME().name, role: ME().role, action: 'Waiver: ' + gate, from: '—', to: '—', note: reason, override: ov || undefined, ts: nowStr() }); toast(`Waiver cho gate <b>${gate}</b> đã ghi audit log.`, 'warn'); render(); break; }
    case 'approve': { const g = gates(); if (!g.ready || !CAN.approveRelease(S.role)) return; if (S.waivers.some(w => w.requestedBy === ME().name && g.list.find(x => x.key === w.gate)?.state === 'waived')) return toast('Separation of duties: không tự duyệt release dựa trên waiver của chính mình.', 'bad'); const ov = S.role === 'super' ? $('#ap-override').value.trim() : ''; if (S.role === 'super' && !ov) { $('#ap-override').closest('.field').classList.add('err'); return toast('Super Admin phải nhập lý do override.', 'warn'); } S.log.push({ issueId: '—', actor: ME().name, role: ME().role, action: 'Approve release ' + CTX.version, from: '—', to: '—', note: '', override: ov || undefined, ts: nowStr() }); S.released = { role: ME().role, override: ov, by: ME().name, at: new Date().toISOString().slice(0, 16).replace('T', ' ') }; S.releases.unshift({ ver: CTX.version, date: S.released.at.slice(0, 10), run: CTX.run, snapshot: CTX.snapshot, status: 'Current', by: ME().name, waivers: S.waivers.length }); S.releases[1].status = 'Superseded'; toast(`Đã phê duyệt và phát hành ${CTX.dataset} ${CTX.version}. Manifest đã tạo.`, 'ok'); go('#/reports/manifest'); break; }
    case 'export': toast(`Export ${k} (mô phỏng) — kèm manifest & provenance của report QR-091-02.`); break;
    case 'cfg-save': { const n = +S.cfg.version.split('v')[1] + 1; S.cfg.version = 'cfg-v' + n; S.cfg.history.unshift({ v: S.cfg.version, by: ME().name, at: '2026-10-04', note: 'Chỉnh sửa trong phiên demo', runs: 'chưa dùng' }); S.cfg.dirty = false; toast(`Đã lưu ${S.cfg.version}. Run #${CTX.run} vẫn dùng cfg-v7.`, 'ok'); render(); break; }
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.f) { S.ws.form[t.dataset.f] = t.type === 'checkbox' ? t.checked : t.value; if (S.ws.errors[t.dataset.f]) { delete S.ws.errors[t.dataset.f]; t.closest('.field')?.classList.remove('err'); } }
  if (t.dataset.home) { S.homeQ = t.value; const pos = t.selectionStart; render(); const n = $('[data-home="q"]'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } return; }
  if (t.dataset.pickTask || t.dataset.pickJob) return;
  if (t.dataset.an) { S.an[t.dataset.an] = t.value; render(); return; }
  if (t.dataset.rh) { S.rh[t.dataset.rh] = t.value; const pos = t.selectionStart; render(); const n = $(`[data-rh="${t.dataset.rh}"]`); if (n) { n.focus(); if (pos != null && n.setSelectionRange) n.setSelectionRange(pos, pos); } return; }
  if (t.dataset.rc) { S.rc[t.dataset.rc] = t.value; const pos = t.selectionStart; render(); const n = $(`[data-rc="${t.dataset.rc}"]`); if (n) { n.focus(); if (pos != null && n.setSelectionRange) n.setSelectionRange(pos, pos); } }
  if (t.dataset.ovl) { S.ws.ovl[t.dataset.ovl] = t.checked; redrawCanvas(); }
  if (t.hasAttribute('data-cfg') && !S.cfg.dirty) { S.cfg.dirty = true; const b = $('[data-act="cfg-save"]'); if (b) b.disabled = false; }
  if (t.closest('.field.err') && t.value) t.closest('.field').classList.remove('err');
});
document.addEventListener('change', e => {
  if (e.target.id === 'roleSel') { if (formDirty() && !confirm('Quyết định đang nhập chưa được lưu. Chuyển vai trò sẽ huỷ form — tiếp tục?')) { e.target.value = S.role; return; } setRole(e.target.value); const h = ROLE_HOME[S.role]; if (routePath() === h) { onRoute(); render(); } else location.hash = h; return; }
  if (e.target.dataset.pickTask || e.target.dataset.pickJob) { const ds = curDS(); const pick = S.an.pick[ds.id]; if (e.target.dataset.pickTask) ds.jobs.filter(j => j.task === e.target.dataset.pickTask).forEach(j => pick[j.id] = e.target.checked); else pick[e.target.dataset.pickJob] = e.target.checked; render(); }
});
document.addEventListener('keydown', e => {
  const t = e.target; const typing = /INPUT|TEXTAREA|SELECT/.test(t.tagName);
  if (e.key === 'Escape') { hideTip(); if (S.pop) { closePop(); return; } if ($('#dlg').open) return; if (S.ws.dec) { S.ws.dec = null; render(); } $('#app').classList.remove('nav-open'); return; }
  if (S.route.name === 'workspace' && (e.ctrlKey || e.metaKey) && e.key === 'Enter' && S.ws.dec) { e.preventDefault(); saveDecision(); return; }
  if (typing || e.ctrlKey || e.metaKey || e.altKey || $('#dlg').open) return;
  if (e.key === '?') { e.preventDefault(); $('[data-act="shortcuts"]').click(); return; }
  if (e.key === 'Enter' && t.matches('tr[data-act]')) { t.click(); return; }
  if (S.route.name !== 'workspace' || !canAccess('workspace')) return;
  const map = { c: 'confirm', r: 'reject', u: 'uncertain', w: 'rework', e: 'escalate' };
  const key = e.key.toLowerCase();
  if (map[key] && S.ws.mode === 'issue') { const b = $(`.dec[data-k="${map[key]}"]`); if (b && !b.disabled) { e.preventDefault(); b.click(); } return; }
  if (key === 'j') return navIssue(1);
  if (key === 'k') return navIssue(-1);
  if (key === 'f') { e.preventDefault(); $(`[data-act="mode"][data-k="${S.ws.mode === 'issue' ? 'frame' : 'issue'}"]`).click(); return; }
  if (['1', '2', '3', '4'].includes(key)) { S.ws.aiTab = ['evidence', 'guideline', 'explanation', 'history'][+key - 1]; render(); return; }
  if (key === '+' || key === '=') zoom(0.8); if (key === '-') zoom(1.25); if (key === '0') { S.ws.view = { x: 0, y: 0, w: 960, h: 540 }; redrawCanvas(); }
});
$('#dlg').addEventListener('click', e => { if (e.target === $('#dlg')) closeDialog(); });

/* ---------- init ---------- */
S.snaps = { 'rv-urban-1.4': SNAPSHOTS.map(x => ({ ...x })), ...JSON.parse(JSON.stringify(SNAP_EXTRA)) };
if (!location.hash) history.replaceState(null, '', '#/home');
S.route = parseHash(); setRole(S.role, true); onRoute(); render();

</script>
