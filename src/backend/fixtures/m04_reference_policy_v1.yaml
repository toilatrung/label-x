# PO approved configurable QA policy in the M-04 response dated 2026-10-12 (D05).
# These are editable draft defaults, not a locked evaluation/reference policy.
# E-06 must validate, snapshot and hash this file before QA confirms/locks a reference.
schema_version: labelx.reference-policy.v1
policy_version: m04-reference-policy-draft-v2
status: draft
qa_confirmation:
  required: true
  confirmed_by: null
  confirmed_at: null
  guideline_version: null
  reference_lock_allowed: false

source:
  learner_package: fixtures/learner/m04/LEARNER_EXPORTS
  coverage_inventory: fixtures/learner/m04/inventory.json
  source_decision: .agent/governance/decisions/DEC-014.html
  policy_decision: .agent/governance/decisions/DEC-016.html
  gt_source: original_bdd100k_labels
  learner_is_ground_truth: false

matching:
  # PO selected these values conditional on QA/model boundary review (DEC-016).
  threshold_iou: 0.5
  ambiguous_iou: 0.3
  approval_status: approved_pending_review
  po_approved_by: toilatrung
  po_approved_on: 2026-10-12
  reviewed_by: null
  review_evidence: null
  geometry_before_class: true
  objective: maximum_cardinality_then_total_iou

eligibility:
  coordinate_space: original_image_pixels
  minimum_area_px2: 24.0
  minimum_area_comparison: strictly_less_than_is_ignored
  minimum_area_basis: sample_guideline_GEO-01_pending_QA_confirmation
  # Each class inherits 24 px²; QA may override individual classes in this map.
  minimum_area_px2_by_class: {}
  classes:
    - pedestrian
    - rider
    - car
    - truck
    - bus
    - train
    - motorcycle
    - bicycle
    - traffic light
    - traffic sign
  ignored_objects:
    remove_from_numerator_and_denominator: true
    require_rule_id_and_reason: true
  occlusion:
    # YOLO has no visibility ratio. Do not infer a ratio from an occluded flag.
    minimum_visible_fraction: 0.2
    numeric_default_basis: sample_guideline_VEH-01_pending_QA_confirmation
    when_visible_fraction_is_known_and_below_minimum: ignore_with_QA_approved_rule
    when_only_occluded_flag_is_known: needs_QA_review
    when_metadata_is_unknown: needs_QA_review
  truncation:
    mode: needs_QA_review
    automatic_ignore: false
    rule_id: null
    when_metadata_is_unknown: needs_QA_review
  coverage:
    label_file_missing: not_annotated
    empty_label_file: needs_QA_confirmation
    empty_is_not_automatically_missing: true
    exclude_unannotated_from_evaluation_scope: true
    publish_exclusion_counts_and_reasons: true

lock_requirements:
  unresolved_eligibility_cases_allowed: false
  qa_confirmed_policy_required: true
  approved_matching_required: true
  verified_video_groups_required: true
  immutable_policy_copy_and_sha256_required: true
  changes_after_lock_create_new_version: true

already_accepted_technical_parameters:
  # DEC-013 accepted these numbers; D07 has no new change in the M-04 response.
  source_decision: .agent/governance/decisions/DEC-013.html
  canonical_coordinate_precision: 6
  score_v0_annotation_epsilon: 0.01

integration:
  reference_runtime_connected: false
  note: Draft config artifact for E-06 integration; existing Geometry/Detector behavior is unchanged.

roles:
  source_decision: .agent/governance/decisions/DEC-016.html
  qa_lead: ducha180104
  qc_admin: toilatrung
  reference_preparer: duy12345-6789
  reference_locker: ducha180104
  model_owner: vietanhhhhhh2003
  backup: null
  dataset_scope_assignment: pending
  api_grants_applied: false

media_scope:
  mode: images_and_frames_only
  video_processing_enabled: false
  temporal_analysis_enabled: false
  source_group_metadata_is_video_processing: false
  source_group_leakage_checks_required: true
  split_policy: pending
  calibration_N: null
  heldout_N: null
  seed: null

calibration:
  n_min_positive_issues_per_family: 50
  target_folds: 5
  approval_status: approved_conditional_on_statistics
  grouping: verified_source_groups
  statistics_evidence: null
  require_positive_and_negative_in_training_folds: true
  fallback: score_v0_with_explicit_family_and_reason
  heldout_training_allowed: false
  calibrated_acceptance_without_evidence: false
