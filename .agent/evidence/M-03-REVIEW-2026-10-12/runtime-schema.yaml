        cvat_url:
          type: string
          readOnly: true
        frames:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotFrame'
          readOnly: true
      required:
      - assignee_user_id
      - cvat_job_id
      - cvat_task_id
      - cvat_url
      - frames
      - job_hash
    SnapshotScope:
      type: object
      properties:
        cvat_task_ids:
          type: array
          items:
            type: integer
            minimum: 1
        cvat_job_ids:
          type: array
          items:
            type: integer
            minimum: 1
    Status1c2Enum:
      enum:
      - pending
      - exporting
      - locked
      - failed
      type: string
      description: |-
        * `pending` - Pending
        * `exporting` - Exporting
        * `locked` - Locked
        * `failed` - Failed
    WorkUnit:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        engine:
          type: string
          readOnly: true
        shard_key:
          type: string
          readOnly: true
        shard_index:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/WorkUnitStatusEnum'
          readOnly: true
        attempt:
          type: integer
          readOnly: true
        last_error:
          type: string
          readOnly: true
        started_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        finished_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - attempt
      - engine
      - finished_at
      - id
      - last_error
      - shard_index
      - shard_key
      - started_at
      - status
    WorkUnitStatusEnum:
      enum:
      - pending
      - running
      - completed
      - failed
      - cancelled
      type: string
      description: |-
        * `pending` - Pending
        * `running` - Running
        * `completed` - Completed
        * `failed` - Failed
        * `cancelled` - Cancelled
    WorkflowPermissions:
      type: object
      properties:
        matrix:
          type: array
          items:
            type: object
            additionalProperties: {}
        rules:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowRule'
        user_roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleAssignment'
      required:
      - matrix
      - rules
      - user_roles
    WorkflowRule:
      type: object
      properties:
        rule:
          type: string
        name:
          type: string
        description:
          type: string
        enforced:
          type: boolean
      required:
      - description
      - enforced
      - name
      - rule
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
