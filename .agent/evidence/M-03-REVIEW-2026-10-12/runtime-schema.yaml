components:
  schemas:
    ActivityEnum:
      enum:
      - view_frame
      - review_issue
      - adjudicate
      - recheck_verify
      type: string
      description: |-
        * `view_frame` - View frame
        * `review_issue` - Review issue
        * `adjudicate` - Adjudicate
        * `recheck_verify` - Recheck / verify
    Candidate:
      type: object
      description: Schema for Candidate matching OpenAPI components.schemas.Candidate.
      properties:
        engine:
          type: string
          readOnly: true
        engine_version:
          type: string
          readOnly: true
        family:
          type: string
          readOnly: true
        severity:
          type: string
          nullable: true
          readOnly: true
        frame:
          type: object
          additionalProperties:
            type: integer
          readOnly: true
        anchor:
          readOnly: true
        evidence:
          readOnly: true
      required:
      - anchor
      - engine
      - engine_version
      - evidence
      - family
      - frame
      - severity
    CodeEnum:
      enum:
      - VALIDATION_ERROR
      - INVALID_CREDENTIALS
      - NOT_AUTHENTICATED
      - FORBIDDEN
      - OUT_OF_SCOPE
      - SELF_REVIEW_FORBIDDEN
      - SAME_REQUESTER_APPROVER
      - IDENTITY_MAPPING_MISSING
      - NOT_FOUND
      - LEASE_CONFLICT
      - INVALID_TRANSITION
      - REVISION_UNCHANGED
      - IDEMPOTENCY_KEY_REUSED
      - SCOPE_BUSY
      - ISSUE_EXISTS
      - BUSINESS_RULE_UNMET
      - INSUFFICIENT_SAMPLE
      type: string
      description: |-
        * `VALIDATION_ERROR` - VALIDATION_ERROR
        * `INVALID_CREDENTIALS` - INVALID_CREDENTIALS
        * `NOT_AUTHENTICATED` - NOT_AUTHENTICATED
        * `FORBIDDEN` - FORBIDDEN
        * `OUT_OF_SCOPE` - OUT_OF_SCOPE
        * `SELF_REVIEW_FORBIDDEN` - SELF_REVIEW_FORBIDDEN
        * `SAME_REQUESTER_APPROVER` - SAME_REQUESTER_APPROVER
        * `IDENTITY_MAPPING_MISSING` - IDENTITY_MAPPING_MISSING
        * `NOT_FOUND` - NOT_FOUND
        * `LEASE_CONFLICT` - LEASE_CONFLICT
        * `INVALID_TRANSITION` - INVALID_TRANSITION
        * `REVISION_UNCHANGED` - REVISION_UNCHANGED
        * `IDEMPOTENCY_KEY_REUSED` - IDEMPOTENCY_KEY_REUSED
        * `SCOPE_BUSY` - SCOPE_BUSY
        * `ISSUE_EXISTS` - ISSUE_EXISTS
        * `BUSINESS_RULE_UNMET` - BUSINESS_RULE_UNMET
        * `INSUFFICIENT_SAMPLE` - INSUFFICIENT_SAMPLE
    ConfigVersion:
      type: object
