openapi: 3.0.3
info:
  title: LabelX API
  version: 0.1.0
  description: Quality Control cho annotation CVAT
paths:
  /api/auth/csrf/:
    get:
      operationId: auth_csrf
      summary: Đặt cookie csrftoken
      tags:
      - auth
      responses:
        '204':
          description: Đã đặt cookie csrftoken
  /api/auth/login/:
    post:
      operationId: auth_login
      summary: Đăng nhập, tạo session
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Dữ liệu không hợp lệ (VALIDATION_ERROR, INVALID_CREDENTIALS)
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Thiếu hoặc sai CSRF (FORBIDDEN)
  /api/auth/logout/:
    post:
      operationId: auth_logout
      summary: Đăng xuất, huỷ session
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: Đã đăng xuất (gọi lại khi đã đăng xuất cũng trả 204)
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Thiếu hoặc sai CSRF (FORBIDDEN)
  /api/auth/session/:
    get:
      operationId: auth_session
      summary: Người dùng, vai trò theo scope, identity mapping
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Chưa đăng nhập hoặc phiên hết hạn (NOT_AUTHENTICATED)
  /api/auth/workflow-permissions/:
    get:
      operationId: auth_workflow_permissions
      summary: Ma trận phân quyền và quy tắc quy trình cho màn WorkflowPermissions
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowPermissions'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Chưa đăng nhập hoặc không đủ quyền (FORBIDDEN, NOT_AUTHENTICATED)
  /api/config-versions/:
    get:
      operationId: config_versions_list
      parameters:
      - in: query
        name: status
        schema:
          type: string
      tags:
      - config
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedConfigVersion'
          description: ''
    post:
      operationId: config_versions_create
      tags:
      - config
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigVersionCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConfigVersionCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConfigVersionCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigVersion'
          description: ''
  /api/config-versions/{id}/publish/:
    post:
      operationId: config_versions_publish
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - config
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigVersion'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/datasets/:
    get:
      operationId: datasets_list
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
        description: Con trỏ trang từ trường next/previous (CursorPagination, PAGE_SIZE=50)
      tags:
      - datasets
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDatasetList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Cursor Dataset không hợp lệ.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Không có phạm vi Dataset.
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Không đọc được project CVAT.
  /api/datasets/{id}/tasks/:
    get:
      operationId: datasets_tasks
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: ID của dataset (CVAT project ID)
        required: true
      tags:
      - datasets
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CvatTask'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Yêu cầu không hợp lệ.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Không có quyền truy cập Dataset.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Dataset không tồn tại.
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Không đọc được Task/Job CVAT.
  /api/decision-cases/:
    get:
      operationId: api_decision_cases_retrieve
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/decision-cases/{id}/:
    get:
      operationId: api_decision_cases_retrieve_2
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/effort-events/:
    post:
      operationId: effort_events_create
      tags:
      - evaluation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EffortEventBatch'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EffortEventBatch'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EffortEventBatch'
        required: true
      security:
      - cookieAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffortEventReceipt'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/escalations/:
    get:
      operationId: api_escalations_retrieve
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/frames/{id}/complete/:
    post:
      operationId: api_frames_complete_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/frames/{id}/issues/:
    get:
      operationId: api_frames_issues_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/guidelines/mappings/:
    get:
      operationId: guidelines_mappings_list
      description: GET /api/guidelines/mappings/ — read-only mapping context → rule
        IDs.
      summary: Tra mapping nhóm lỗi/lớp tới rule ID
      parameters:
      - in: query
        name: class_name
        schema:
          type: string
      - in: query
        name: cursor
        schema:
          type: string
      - in: query
        name: family
        schema:
          type: string
          enum:
          - E1
          - E2
          - E3
          - structural
      - in: query
        name: paired_class
        schema:
          type: string
      - in: query
        name: version
        schema:
          type: string
      tags:
      - guidelines
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRuleMappingList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/guidelines/rules/:
    get:
      operationId: guidelines_rules_list
      description: Không dùng retrieval ngữ nghĩa (FR-GDL-04). Mặc định guideline
        version mới nhất.
      summary: Tra rule theo nhóm lỗi, lớp, cặp lớp
      parameters:
      - in: query
        name: class_name
        schema:
          type: string
        description: Tên lớp
      - in: query
        name: cursor
        schema:
          type: string
        description: Con trỏ phân trang
      - in: query
        name: family
        schema:
          type: string
          enum:
          - E1
          - E2
          - E3
          - structural
        description: 'Nhóm lỗi (IssueFamily): E1, E2, E3, structural'
      - in: query
        name: paired_class
        schema:
          type: string
        description: Lớp cặp
      - in: query
        name: version
        schema:
          type: string
        description: Guideline version tag; bỏ trống là bản mới nhất.
      tags:
      - guidelines
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGuidelineRuleList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/guidelines/rules/{rule_id}/:
    get:
      operationId: guidelines_rules_retrieve
      description: Trả thông tin một rule theo rule_id. Dùng query param version để
        chọn phiên bản; mặc định là phiên bản mới nhất. Trả 404 nếu rule_id không
        tồn tại.
      summary: Rule theo guideline version của snapshot
      parameters:
      - in: path
        name: rule_id
        schema:
          type: string
        required: true
      - in: query
        name: version
        schema:
          type: string
        description: Guideline version tag; bỏ trống là bản mới nhất.
      tags:
      - guidelines
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuidelineRule'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/issues/:
    post:
      operationId: api_issues_create
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/issues/{id}/:
    get:
      operationId: api_issues_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/issues/{id}/adjudications/:
    post:
      operationId: api_issues_adjudications_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/issues/{id}/decisions/:
    post:
      operationId: api_issues_decisions_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/leases/{id}/renew/:
    post:
      operationId: api_leases_renew_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/queues/{name}/next/:
    post:
      operationId: api_queues_next_create
      parameters:
      - in: path
        name: name
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/rework/:
    post:
      operationId: api_rework_create
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/rework/{id}/submitted/:
    post:
      operationId: api_rework_submitted_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/rework/{id}/verify/:
    post:
      operationId: api_rework_verify_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/runs/:
    get:
      operationId: runs_list
      description: 'Collection endpoint: GET /api/runs/ and POST /api/runs/.'
      parameters:
      - in: query
        name: dataset
        schema:
          type: integer
      - in: query
        name: snapshot
        schema:
          type: integer
      tags:
      - runs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRunList'
          description: ''
    post:
      operationId: runs_create
      description: 'Collection endpoint: GET /api/runs/ and POST /api/runs/.'
      tags:
      - runs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RunCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RunCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
          description: ''
  /api/runs/{id}/:
    get:
      operationId: runs_retrieve
      description: 'Retrieve run details: GET /api/runs/{id}/.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - runs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/runs/{id}/cancel/:
    post:
      operationId: runs_cancel
      description: 'Cancel run: POST /api/runs/{id}/cancel/.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - runs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/runs/{id}/candidates/:
    get:
      operationId: runs_candidates
      description: 'List candidates for a QC run: GET /api/runs/{id}/candidates/ (CR-108
        Option 2).'
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
      - in: query
        name: engine
        schema:
          type: string
      - in: query
        name: family
        schema:
          type: string
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: query
        name: page_size
        schema:
          type: integer
      tags:
      - runs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCandidateList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/runs/{id}/ledger/:
    get:
      operationId: runs_ledger
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - runs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LedgerEntry'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/runs/{id}/ranking/:
    get:
      operationId: runs_ranking
      description: Read a persisted risk or independent random-audit queue for one
        run.
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
      - in: query
        name: family
        schema:
          type: string
          enum:
          - E1
          - E2
          - E3
          - structural
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: query
        name: origin
        schema:
          type: string
          enum:
          - engine
          - reviewer
      - in: query
        name: queue
        schema:
          type: string
          enum:
          - random
          - risk
      - in: query
        name: review_state
        schema:
          type: string
          enum:
          - awaiting_followup
          - completed
          - in_review
          - incomplete
          - reviewed
          - unreviewed
      tags:
      - runs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRankedFrameList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/runs/{id}/retry-failed/:
    post:
      operationId: runs_retry_failed
      description: 'Retry failed work units: POST /api/runs/{id}/retry-failed/.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - runs
      security:
      - cookieAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
