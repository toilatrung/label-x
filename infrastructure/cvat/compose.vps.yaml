services:
  cvat_db:
    image: postgres:15-alpine@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
    mem_limit: 512m
    cpus: '0.5'
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    environment:
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_PASSWORD: ${CVAT_POSTGRES_PASSWORD:?private env required}
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U root -d cvat
      interval: 10s
      timeout: 5s
      retries: 12
  cvat_redis_inmem:
    image: redis:7.2.11-alpine@sha256:1a34bdba051ecd8a58ec8a3cc460acef697a1605e918149cc53d920673c1a0a7
    mem_limit: 128m
    cpus: '0.5'
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 12
  cvat_redis_ondisk:
    image: apache/kvrocks:2.15.0@sha256:0192707bd335ad546d8ec7826b1553b674fff27d6cea4195e22c0f1adbdbea40
    mem_limit: 256m
    cpus: '0.5'
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  cvat_server:
    image: cvat/server:v2.77.0@sha256:9119c7e00a41204820e6591f5e17b021c5e12999b6182a0b2a5348b2452b3d02
    mem_limit: 1024m
    cpus: '1.0'
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    environment:
      DJANGO_LOG_SERVER_HOST: ${DJANGO_LOG_SERVER_HOST:-}
      CVAT_ANALYTICS: ${CVAT_ANALYTICS:-0}
      CVAT_POSTGRES_PASSWORD: ${CVAT_POSTGRES_PASSWORD:?private env required}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?private env required}
      DJANGO_SETTINGS_MODULE: cvat.settings.labelx
      CVAT_BASE_URL: https://cvat.williamtrinh.online
      NUMPROCS: '1'
    volumes:
    - ../settings.py:/opt/cvat/cvat/settings/labelx.py:ro
    - ../provision-reader.py:/home/django/provision-labelx-reader.py:ro
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/server/about',timeout=5)
      interval: 20s
      timeout: 10s
      start_period: 180s
      retries: 12
    depends_on: !override
      cvat_redis_inmem:
        condition: service_started
      cvat_redis_ondisk:
        condition: service_started
      cvat_db:
        condition: service_started
      cvat_opa:
        condition: service_started
  cvat_worker_utils:
    image: cvat/server:v2.77.0@sha256:9119c7e00a41204820e6591f5e17b021c5e12999b6182a0b2a5348b2452b3d02
