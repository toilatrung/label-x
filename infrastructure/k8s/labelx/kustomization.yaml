{
  "apiVersion": "kustomize.config.k8s.io/v1beta1",
  "kind": "Kustomization",
  "namespace": "labelx",
  "resources": [
    "preflight.yaml",
    "namespace.yaml",
    "config.yaml",
    "storage.yaml",
    "datastores.yaml",
    "backup.yaml",
    "migration.yaml",
    "applications.yaml",
    "ingress.yaml",
    "network-policy.yaml",
    "smoke.yaml",
    "object-storage.yaml",
    "cvat-ingress.yaml",
    "capacity.yaml"
  ],
  "generatorOptions": {
    "disableNameSuffixHash": true,
    "annotations": {
      "argocd.argoproj.io/sync-wave": "-30"
    }
  },
  "configMapGenerator": [
    {
      "name": "labelx-ops",
      "files": [
        "ops/migrate.py",
        "ops/backup.sh",
        "ops/backup-upload.py",
        "ops/smoke.py",
        "ops/storage-init.py",
        "ops/disk-check.py"
      ]
    },
    {
      "name": "labelx-release",
      "literals": [
        "SOURCE_SHA=912f1f58c01c3c35922e32fb439cfd4bd7fbda4e",
        "MVP_EVIDENCE=unverified",
        "DEPLOYMENT_POLICY=CR-120"
      ]
    },
    {
      "name": "labelx-s3-master",
      "files": [
        "ops/master.toml"
      ]
    }
  ],
  "images": [
    {
      "name": "labelx-backend",
      "newName": "ghcr.io/toilatrung/labelx-backend",
      "digest": "sha256:82293a5df5aa2a3f66f79913d2ada6769b0954386bac7e09dba281e83eb78c1a"
    },
    {
      "name": "labelx-frontend",
      "newName": "ghcr.io/toilatrung/labelx-frontend",
      "digest": "sha256:01d01cb26739a1873d15802f0134ba34350dd9309b4778ead107e086aad03cc0"
    }
  ]
}
