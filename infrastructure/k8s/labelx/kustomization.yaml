{
  "apiVersion": "kustomize.config.k8s.io/v1beta1",
  "kind": "Kustomization",
  "namespace": "labelx",
  "resources": [
    "preflight.yaml",
    "namespace.yaml",
    "config.yaml",
    "storage.yaml",
    "datastores.yaml",
    "backup.yaml",
    "migration.yaml",
    "applications.yaml",
    "ingress.yaml",
    "network-policy.yaml",
    "smoke.yaml",
    "object-storage.yaml",
    "cvat-ingress.yaml",
    "capacity.yaml"
  ],
  "generatorOptions": {
    "disableNameSuffixHash": true,
    "annotations": {
      "argocd.argoproj.io/sync-wave": "-30"
    }
  },
  "configMapGenerator": [
    {
      "name": "labelx-ops",
      "files": [
        "ops/migrate.py",
        "ops/backup.sh",
        "ops/backup-upload.py",
        "ops/smoke.py",
        "ops/storage-init.py",
        "ops/disk-check.py"
      ]
    },
    {
      "name": "labelx-release",
      "literals": [
        "SOURCE_SHA=ec55ab836351bad0b1b2536baa5368a55f135ce1",
        "MVP_EVIDENCE=unverified",
        "DEPLOYMENT_POLICY=CR-120"
      ]
    },
    {
      "name": "labelx-s3-master",
      "files": [
        "ops/master.toml"
      ]
    }
  ],
  "images": [
    {
      "name": "labelx-backend",
      "newName": "ghcr.io/toilatrung/labelx-backend",
      "digest": "sha256:e498b71b6eba6fd50e6cddb8f2abad32638538188919c2f14c41be53ca0202e4"
    },
    {
      "name": "labelx-frontend",
      "newName": "ghcr.io/toilatrung/labelx-frontend",
      "digest": "sha256:48a1c6ed67cf8c7c5360c5b58a4b63c8f94033421c8cc0ecb25b8f18ec512d38"
    }
  ]
}
