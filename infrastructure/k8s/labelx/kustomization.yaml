{
  "apiVersion": "kustomize.config.k8s.io/v1beta1",
  "kind": "Kustomization",
  "namespace": "labelx",
  "resources": [
    "preflight.yaml",
    "namespace.yaml",
    "config.yaml",
    "storage.yaml",
    "datastores.yaml",
    "backup.yaml",
    "migration.yaml",
    "applications.yaml",
    "ingress.yaml",
    "network-policy.yaml",
    "smoke.yaml",
    "object-storage.yaml",
    "cvat-ingress.yaml",
    "capacity.yaml"
  ],
  "generatorOptions": {
    "disableNameSuffixHash": true,
    "annotations": {
      "argocd.argoproj.io/sync-wave": "-30"
    }
  },
  "configMapGenerator": [
    {
      "name": "labelx-ops",
      "files": [
        "ops/migrate.py",
        "ops/backup.sh",
        "ops/backup-upload.py",
        "ops/smoke.py",
        "ops/storage-init.py",
        "ops/disk-check.py"
      ]
    },
    {
      "name": "labelx-release",
      "literals": [
        "SOURCE_SHA=7dd22245c77ed5b7cfeb13dd0d08ad73bddbe874",
        "MVP_EVIDENCE=unverified",
        "DEPLOYMENT_POLICY=CR-120"
      ]
    },
    {
      "name": "labelx-s3-master",
      "files": [
        "ops/master.toml"
      ]
    }
  ],
  "images": [
    {
      "name": "labelx-backend",
      "newName": "ghcr.io/toilatrung/labelx-backend",
      "digest": "sha256:39855ce83c70789d837ac55575fe2499d0218b5cfcb7d5202a5838510eb66e48"
    },
    {
      "name": "labelx-frontend",
      "newName": "ghcr.io/toilatrung/labelx-frontend",
      "digest": "sha256:03a259d70f0da6c95b30280942f51b2bf5944522c96a51271b9c8402094c2ebb"
    }
  ]
}
