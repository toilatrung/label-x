{
  "apiVersion": "kustomize.config.k8s.io/v1beta1",
  "kind": "Kustomization",
  "namespace": "labelx",
  "resources": [
    "preflight.yaml",
    "namespace.yaml",
    "config.yaml",
    "storage.yaml",
    "datastores.yaml",
    "backup.yaml",
    "migration.yaml",
    "applications.yaml",
    "ingress.yaml",
    "network-policy.yaml",
    "smoke.yaml",
    "object-storage.yaml",
    "cvat-ingress.yaml",
    "capacity.yaml"
  ],
  "generatorOptions": {
    "disableNameSuffixHash": true,
    "annotations": {
      "argocd.argoproj.io/sync-wave": "-30"
    }
  },
  "configMapGenerator": [
    {
      "name": "labelx-ops",
      "files": [
        "ops/migrate.py",
        "ops/backup.sh",
        "ops/backup-upload.py",
        "ops/smoke.py",
        "ops/storage-init.py",
        "ops/disk-check.py"
      ]
    },
    {
      "name": "labelx-release",
      "literals": [
        "SOURCE_SHA=fa6cb0cda845af43819aa5dea444bffe3b1b38e3",
        "MVP_EVIDENCE=unverified",
        "DEPLOYMENT_POLICY=CR-120"
      ]
    },
    {
      "name": "labelx-s3-master",
      "files": [
        "ops/master.toml"
      ]
    }
  ],
  "images": [
    {
      "name": "labelx-backend",
      "newName": "ghcr.io/toilatrung/labelx-backend",
      "digest": "sha256:95a0874a5ba674f85a9ab5ad545ea336c1fe11435df0180211321c2e0a056c8a"
    },
    {
      "name": "labelx-frontend",
      "newName": "ghcr.io/toilatrung/labelx-frontend",
      "digest": "sha256:27209e8e479713a290812965605a70d0780f39a1e24d5e4292804f577d157acd"
    }
  ]
}
