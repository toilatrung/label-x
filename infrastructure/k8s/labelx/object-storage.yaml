apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: labelx-s3
  labels:
    app.kubernetes.io/part-of: labelx
  annotations:
    argocd.argoproj.io/sync-wave: '-20'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: labelx-retain
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: labelx-s3
  labels:
    app.kubernetes.io/part-of: labelx
  annotations:
    argocd.argoproj.io/sync-wave: '-20'
spec:
  selector:
    app.kubernetes.io/name: labelx-s3
  ports:
  - name: s3
    port: 9000
    targetPort: 9000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: labelx-s3
  labels:
    app.kubernetes.io/part-of: labelx
  annotations:
    argocd.argoproj.io/sync-wave: '-20'
spec:
  replicas: 1
  serviceName: labelx-s3
  selector:
    matchLabels:
      app.kubernetes.io/name: labelx-s3
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels:
        app.kubernetes.io/name: labelx-s3
        app.kubernetes.io/part-of: labelx
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: seaweedfs
        image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
        command:
        - weed
        - -telemetry=false
        - server
        - -dir=/data
        - -s3
        - -s3.port=9000
        - -s3.config=/secrets/s3.json
        - -master.volumeSizeLimitMB=1024
        - -volume.max=12
        - -volume.minFreeSpace=15
        - -s3.allowedOrigins=https://label-x.williamtrinh.online,https://cvat.williamtrinh.online
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 150m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 512Mi
            ephemeral-storage: 256Mi
        ports:
        - containerPort: 9000
        - containerPort: 9333
        startupProbe:
          tcpSocket:
            port: 9000
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          tcpSocket:
            port: 9000
          periodSeconds: 10
        livenessProbe:
          httpGet:
            port: 9333
            path: /cluster/status
          periodSeconds: 30
          timeoutSeconds: 5
        volumeMounts:
        - name: data
          mountPath: /data
        - name: config
          mountPath: /secrets
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: master
          mountPath: /etc/seaweedfs
          readOnly: true
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: labelx-s3
      - name: config
        secret:
          secretName: labelx-s3
          items:
          - key: s3.json
            path: s3.json
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
      - name: master
        configMap:
          name: labelx-s3-master
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: labelx-s3
  labels:
    app.kubernetes.io/part-of: labelx
  annotations:
    argocd.argoproj.io/sync-wave: '-20'
    cert-manager.io/issuer: labelx-letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: labelx-labelx-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - s3.williamtrinh.online
    secretName: labelx-s3-tls
  rules:
  - host: s3.williamtrinh.online
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: labelx-s3
            port:
              number: 9000
---
apiVersion: batch/v1
kind: Job
metadata:
  name: labelx-storage-init
  labels:
    app.kubernetes.io/part-of: labelx
  annotations:
    argocd.argoproj.io/sync-wave: '-15'
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: labelx
        app.kubernetes.io/name: labelx-migrate
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: labelx-ghcr
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: storage-init
        image: labelx-backend
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            memory: 256Mi
            cpu: 1000m
        volumeMounts:
        - name: ops
          mountPath: /ops
          readOnly: true
        - name: tmp
          mountPath: /tmp
        command:
        - python
        - /ops/storage-init.py
        envFrom:
        - configMapRef:
            name: labelx-config
        - secretRef:
            name: labelx-runtime
        - secretRef:
            name: labelx-s3
      volumes:
      - name: ops
        configMap:
          name: labelx-ops
          defaultMode: 292
      - name: tmp
        emptyDir: {}
      restartPolicy: Never
