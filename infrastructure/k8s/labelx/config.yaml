apiVersion: v1
kind: ConfigMap
metadata:
  name: labelx-config
  labels:
    app.kubernetes.io/part-of: labelx
  annotations:
    argocd.argoproj.io/sync-wave: '-30'
data:
  PYTHONPATH: /app
  DJANGO_SETTINGS_MODULE: config.production
  DJANGO_DEBUG: 'False'
  DJANGO_ALLOWED_HOSTS: label-x.williamtrinh.online,labelx-backend,localhost,127.0.0.1
  CORS_ALLOWED_ORIGINS: https://label-x.williamtrinh.online
  CSRF_TRUSTED_ORIGINS: https://label-x.williamtrinh.online
  SECURE_SSL_REDIRECT: 'True'
  SESSION_COOKIE_SECURE: 'True'
  CSRF_COOKIE_SECURE: 'True'
  AWS_EC2_METADATA_DISABLED: 'true'
  FINAL_RUN_AUTO_DISPATCH: 'true'
  ORCHESTRATION_FAIL_FAST: 'true'
  VLM_DISPATCH_WINDOW: '1'
  LABELX_API_PROXY_TARGET: http://labelx-backend:8000
  NEXT_PUBLIC_AUTH_MODE: backend
