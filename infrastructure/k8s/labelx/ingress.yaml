apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: labelx-letsencrypt
  labels:
    app.kubernetes.io/part-of: labelx
  annotations:
    argocd.argoproj.io/sync-wave: '-30'
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: labelx-acme-account
    solvers:
    - http01:
        ingress:
          ingressClassName: traefik
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: labelx-https
  labels:
    app.kubernetes.io/part-of: labelx
  annotations:
    argocd.argoproj.io/sync-wave: '-30'
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: labelx
  labels:
    app.kubernetes.io/part-of: labelx
  annotations:
    cert-manager.io/issuer: labelx-letsencrypt
    argocd.argoproj.io/sync-wave: '0'
    traefik.ingress.kubernetes.io/router.middlewares: labelx-labelx-https@kubernetescrd
    traefik.ingress.kubernetes.io/service.passhostheader: 'true'
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - label-x.williamtrinh.online
    secretName: labelx-tls
  rules:
  - host: label-x.williamtrinh.online
    http:
      paths:
      - path: /healthz/
        pathType: Exact
        backend:
          service:
            name: labelx-backend
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: labelx-frontend
            port:
              number: 3000
