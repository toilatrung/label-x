apiVersion: batch/v1
kind: CronJob
metadata:
  name: labelx-capacity
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  schedule: '*/15 * * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: labelx
            app.kubernetes.io/name: labelx-smoke
        spec:
          automountServiceAccountToken: false
          imagePullSecrets:
          - name: labelx-ghcr
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: smoke
            image: labelx-backend
            imagePullPolicy: IfNotPresent
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                cpu: 250m
                memory: 128Mi
                ephemeral-storage: 64Mi
            volumeMounts:
            - name: ops
              mountPath: /ops
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
              readOnly: true
            - name: backups
              mountPath: /backups
              readOnly: true
            command:
            - python
            - /ops/disk-check.py
          volumes:
          - name: ops
            configMap:
              name: labelx-ops
              defaultMode: 292
          - name: tmp
            emptyDir:
              sizeLimit: 256Mi
          - name: data
            persistentVolumeClaim:
              claimName: labelx-s3
          - name: backups
            persistentVolumeClaim:
              claimName: labelx-backups
          restartPolicy: Never
