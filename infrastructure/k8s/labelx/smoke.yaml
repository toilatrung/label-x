apiVersion: batch/v1
kind: Job
metadata:
  name: labelx-smoke
  labels:
    app.kubernetes.io/part-of: labelx
  annotations:
    argocd.argoproj.io/sync-wave: '10'
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: labelx
        app.kubernetes.io/name: labelx-smoke
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: labelx-ghcr
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: smoke
        image: labelx-backend
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 768Mi
            cpu: 500m
        volumeMounts:
        - name: ops
          mountPath: /ops
          readOnly: true
        - name: tmp
          mountPath: /tmp
        command:
        - python
        - /ops/smoke.py
        envFrom:
        - configMapRef:
            name: labelx-config
        - configMapRef:
            name: labelx-release
        - secretRef:
            name: labelx-runtime
      volumes:
      - name: ops
        configMap:
          name: labelx-ops
          defaultMode: 292
      - name: tmp
        emptyDir: {}
      restartPolicy: Never
