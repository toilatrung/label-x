apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: labelx-postgres
  labels:
    app.kubernetes.io/part-of: labelx
  annotations:
    argocd.argoproj.io/sync-wave: '-20'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: labelx-retain
  resources:
    requests:
      storage: 20Gi
---
