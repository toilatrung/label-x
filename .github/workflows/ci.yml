name: LabelX CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  framework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.12'
      - name: Validate governance framework
        run: uv run --no-project --python 3.12 python scripts/validate-framework.py
      - name: Validate test matrix and HTML freshness
        run: |
          node scripts/ci/quality-gate.cjs validate-plan
          node scripts/ci/render-plan.cjs --check
      - name: Test CI gates
        run: node --test scripts/ci/tests/*.test.cjs
      - name: Generated documentation is up to date
        run: |
          # Markdown (.md) là nguồn của kit; HTML sinh bằng scripts/md2html.py phải khớp.
          uv run --no-project --python 3.12 --with markdown --with pymdown-extensions \
            python scripts/md2html.py --check docs .agent
          # SRS HTML và Markdown tra cứu sinh từ LaTeX; sinh lại và so với bản đã commit.
          python3 scripts/srs_tex2html.py
          python3 scripts/srs_tex2md.py
          git diff --exit-code -- docs/01-business docs/00-project/glossary.md docs/00-project/stakeholders.md

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: labelx_ci
          POSTGRES_USER: labelx_ci
          POSTGRES_PASSWORD: ci-only-isolated-postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U labelx_ci -d labelx_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-deployment-secret-labelx
      DJANGO_DEBUG: 'False'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      DATABASE_URL: postgres://labelx_ci:ci-only-isolated-postgres@localhost:5432/labelx_ci
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      CVAT_BASE_URL: ''
      CVAT_SERVICE_TOKEN: ''
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - name: Lint and types
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen mypy config
      - name: Django and migrations
        run: |
          mkdir -p ../../.ci-artifacts
          uv run --frozen python manage.py check
          uv run --frozen python manage.py makemigrations --check --dry-run
          uv run --frozen python manage.py migrate --noinput
          uv run --frozen python manage.py spectacular --file ../../.ci-artifacts/openapi.yaml --validate
      - name: Full pytest suite
        # Chạy MỌI test trong src/backend/tests để test mới của collaborator không bị bỏ sót;
        # bước quality-gate bên dưới chỉ chạy các ca đã đăng ký trong ma trận truy vết.
        run: uv run --frozen pytest -q --strict-markers
      - name: Execute registered scaffold tests
        working-directory: .
        run: |
          mkdir -p .ci-artifacts
          node scripts/ci/quality-gate.cjs run --phase scaffold
      - name: Package tracked backend source at this commit
        working-directory: .
        run: git archive --format=tar.gz -o .ci-artifacts/backend-source.tar.gz HEAD:src/backend
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-${{ github.sha }}
          path: .ci-artifacts/
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint, types and production build
        run: |
          npm run lint
          npm run typecheck
          npm run build
      - name: Package build without env/cache/node_modules
        working-directory: .
        run: |
          mkdir -p .ci-artifacts
          tar --exclude='.next/cache' -czf .ci-artifacts/frontend-build.tar.gz -C src/frontend .next src package.json package-lock.json next.config.ts tsconfig.json
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-${{ github.sha }}
          path: .ci-artifacts/frontend-build.tar.gz
          if-no-files-found: error
