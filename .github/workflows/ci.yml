name: LabelX CI
on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  bootstrap-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Parse PowerShell bootstrap
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/init-develop-environment.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors; exit 1 }
      - name: Test bootstrap safeguards without installing machine tools
        run: node --test scripts/development/tests/*.test.cjs
  framework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # cần lịch sử base để kiểm quyền ghi .agent/ trên PR
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.12'
      - name: Validate governance framework
        run: uv run --no-project --python 3.12 python scripts/validate-framework.py
      - name: Validate test matrix and HTML freshness
        run: |
          node scripts/ci/quality-gate.cjs validate-plan
          node scripts/ci/render-plan.cjs --check
      - name: Test CI gates
        run: node --test scripts/ci/tests/*.test.cjs
      - name: Per-user .agent files (AGENT.html, CR-100)
        if: github.event_name == 'pull_request'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/check-agent-ownership.cjs
      - name: Test development bootstrap safeguards
        run: |
          bash -n scripts/init-develop-environment.sh
          bash scripts/init-develop-environment.sh --plan
          node --test scripts/development/tests/*.test.cjs
      - name: Generated documentation is up to date
        run: |
          # HTML là định dạng tài liệu duy nhất (CR-103). Tài liệu tra cứu SRS sinh từ LaTeX;
          # sinh lại và so với bản đã commit.
          python3 scripts/srs_tex2html.py
          uv run --no-project --python 3.12 --with markdown --with pymdown-extensions \
            python scripts/srs_tex2docs.py
          git diff --exit-code -- docs/01-business docs/00-project/glossary.html docs/00-project/stakeholders.html

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: labelx_ci
          POSTGRES_USER: labelx_ci
          POSTGRES_PASSWORD: ci-only-isolated-postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U labelx_ci -d labelx_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-deployment-secret-labelx
      DJANGO_DEBUG: 'False'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      DATABASE_URL: postgres://labelx_ci:ci-only-isolated-postgres@localhost:5432/labelx_ci
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      CVAT_BASE_URL: ''
      CVAT_SERVICE_TOKEN: ''
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - name: Lint and types
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen mypy config
      - name: Django and migrations
        run: |
          mkdir -p ../../.ci-artifacts
          uv run --frozen python manage.py check
          uv run --frozen python manage.py makemigrations --check --dry-run
          uv run --frozen python manage.py migrate --noinput
          uv run --frozen python manage.py spectacular --file ../../.ci-artifacts/openapi.yaml --validate
      - name: Full pytest suite
        # Chạy MỌI test trong src/backend/tests để test mới của collaborator không bị bỏ sót;
        # bước quality-gate bên dưới chỉ chạy các ca đã đăng ký trong ma trận truy vết.
        run: uv run --frozen pytest -q --strict-markers
      - name: Execute registered scaffold tests
        working-directory: .
        run: |
          mkdir -p .ci-artifacts
          node scripts/ci/quality-gate.cjs run --phase scaffold
      - name: Package tracked backend source at this commit
        working-directory: .
        run: git archive --format=tar.gz -o .ci-artifacts/backend-source.tar.gz HEAD:src/backend
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-${{ github.sha }}
          path: .ci-artifacts/
          # .ci-artifacts là thư mục ẩn; upload-artifact@v7 mặc định bỏ qua file ẩn.
          include-hidden-files: true
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint, types and production build
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: No mock credentials in client bundle (T-002)
        run: |
          if grep -rl 'password123' .next/static; then
            echo "Mật khẩu tài khoản mẫu lọt vào bundle client" >&2
            exit 1
          fi
      - name: Package build without env/cache/node_modules
        working-directory: .
        run: |
          mkdir -p .ci-artifacts
          tar --exclude='.next/cache' -czf .ci-artifacts/frontend-build.tar.gz -C src/frontend .next src package.json package-lock.json next.config.ts tsconfig.json
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-${{ github.sha }}
          path: .ci-artifacts/frontend-build.tar.gz
          include-hidden-files: true
          if-no-files-found: error
