name: PR approval
# Quy tắc duyệt PR (AGENT.md mục Pull Request Approval, CR-102). Ghi commit status "pr-approval"
# lên head commit của PR; đặt "pr-approval" làm required status check của nhánh main.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]
permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write
concurrency:
  group: pr-approval-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true
jobs:
  approval:
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Luôn lấy script và danh sách approver từ nhánh mặc định, không chạy mã của PR.
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check approval comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: node scripts/ci/check-pr-approval.cjs
